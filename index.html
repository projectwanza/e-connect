// Ledger rows + summary totals. SAME signed rules as the old profile ledger (Sale: +balanceAmount,
// Credit Note: -amount, Payment-in: -(received+paid), Payment-out: +(received+paid)); totals are added in the same pass.
function custLedgerDesc_(t){
  if(t.description) return t.description;
  if(t.transactionType === 'Sale') return 'Sale Invoice';
  if(t.transactionType === 'Payment-in') return 'Payment Received';
  if(t.transactionType === 'Payment-out') return 'Payment Paid';
  if(t.transactionType === 'Credit Note') return 'Credit Note';
  if(t.transactionType === 'Estimate' || t.transactionType === 'Quotation') return 'Estimate / Quotation';
  return t.transactionType || '—';
}
function custLedger_(p, txns){
  const chrono = txns.slice().sort(function(a, b){
    const d = (a.dateRaw||0) - (b.dateRaw||0);
    if (d !== 0) return d;
    return (a.rowNumber||0) - (b.rowNumber||0);
  });
  let running = Number(p.openingBalance) || 0;
  const T = { sales:0, received:0, creditNote:0, paymentOut:0 };
  let lastSale = null, lastPay = null;
  const rows = chrono.map(function(t){
    let debit = 0, credit = 0;
    if(t.transactionType === 'Sale'){ credit = Number(t.balanceAmount)||0; running += credit; T.sales += Number(t.amount)||0; if(!lastSale || (t.dateRaw||0) >= (lastSale.dateRaw||0)) lastSale = t; }
    else if(t.transactionType === 'Credit Note'){ debit = Number(t.amount)||0; running -= debit; T.creditNote += debit; }
    else if(t.transactionType === 'Payment-in'){ debit = (Number(t.receivedAmount)||0) + (Number(t.paidAmount)||0); running -= debit; T.received += debit; if(!lastPay || (t.dateRaw||0) >= (lastPay.dateRaw||0)) lastPay = t; }
    else if(t.transactionType === 'Payment-out'){ credit = (Number(t.receivedAmount)||0) + (Number(t.paidAmount)||0); running += credit; T.paymentOut += credit; }
    return '<tr><td>'+esc(t.date)+'</td><td>'+esc(t.transactionType)+'</td><td>'+esc(t.refNo||'—')+'</td><td>'+esc(custLedgerDesc_(t))+'</td>' +
      '<td>'+(debit ? money(debit) : '—')+'</td><td>'+(credit ? money(credit) : '—')+'</td>' +
      '<td style="font-weight:700;color:'+(running>0?'#c0392b':'#101828')+'">'+money(running)+'</td></tr>';
  });
  return { rows: rows, totals: T, lastSaleDate: lastSale ? lastSale.date : '', lastPaymentDate: lastPay ? lastPay.date : '' };
}

// Splits the entry text into "detail" (distance / location link) and "notes".
function actSplit_(a){
  const raw = String(a.text||'');
  const m = raw.match(/Notes:\s*([\s\S]*)$/i);
  let det = m ? raw.slice(0, m.index) : raw;
  let notes = m ? m[1] : '';
  const lm = notes.match(/\s*\|\s*(Location:[\s\S]*)$/i);   // older "Notes: x | Location: ..." format
  if(lm){ det += '\n' + lm[1]; notes = notes.slice(0, lm.index); }
  return { det: det.trim(), notes: notes.trim() };
}
function actLinkify_(s){
  return esc(s).replace(/\[{1,2}([^\[\]]*)\]{1,2}\((https?:\/\/[^\s)]+)\)/g, function(m, t, u){
    return '<a href="'+u+'" target="_blank" rel="noopener">['+t+']</a>';
  });
}
function actIsVisit_(a){
  return !!a && (a.kind === 'VISIT' || a.kind === 'WHATSAPP' || (a.kind === 'NOTE_ADDED' && !!a.tone) || /Log Visit/i.test(String(a.label||'')));
}
// Visit entry has collapsible part only if it has Distance text or a map link.
function actHasDet_(a){
  return actIsVisit_(a) && !!(String(a.text||'').trim() || a.mapUrl);
}
function actHeadHtml_(a, cls){
  cls = cls || 'badge';      // NEW: Lead timeline passes 'lt-tag'; Customer timeline unchanged ('badge')
  if(!actHasDet_(a)) return '<span class="'+cls+'"'+visitToneAttr_(a)+'>'+esc(a.label)+'</span>';
  return '<span class="'+cls+' act-tg"'+visitToneAttr_(a)+' onclick="toggleActDetail_(this)">'+esc(a.label)+' <span class="act-arrow">&#9660;</span></span>';
}
function actBodyHtml_(a){
  if(!actHasDet_(a)){
    // every non-visit entry: EXACTLY the old rendering
    return '<div class="lt-text">'+esc(a.text)+visitMapLink_(a)+'</div>' +
      (a.detail ? '<div class="lt-text" style="color:var(--text-2);font-size:12.5px;">'+esc(a.detail)+'</div>' : '');
  }
  // Visit: Distance + [See Location] hidden until header is clicked; Notes always visible (bold)
  const notes = String(a.detail||'').replace(/^\s*(Notes|Message):\s*/i,'').trim();
  return '<div class="act-det">'+esc(a.text)+visitMapLink_(a)+'</div>' +
    (notes ? '<div class="lt-text act-notes">'+(a.kind === 'WHATSAPP' ? 'Message' : 'Notes')+': <b>'+esc(notes)+'</b></div>' : '');
}
function toggleActDetail_(el){
  const item = el.closest('.lt-item');
  if(!item) return;
  const open = item.classList.toggle('act-open');
  const ar = el.querySelector('.act-arrow');
  if(ar) ar.innerHTML = open ? '&#9650;' : '&#9660;';
}

// NEW: strict Lat,Long check - exactly "lat,long" numbers within range.
// Empty text, "abc", "22.57" or "22.57,abc" are all treated as missing/invalid.
function isValidLatLong_(s){
  const m = String(s===undefined||s===null?'':s).trim().match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
  if(!m) return false;
  const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
  return lat>=-90 && lat<=90 && lng>=-180 && lng<=180;
}

/* ---- NEW: Shop photo (gallery/camera -> compress -> Google Drive -> link saved on the lead) ---- */
let AC_PHOTO_ = { url:'', uploading:false };
let EL_PHOTO_ = { url:'', uploading:false };
function leadPhotoThumb_(url){
  const m = String(url||'').match(/[?&]id=([\w-]+)/) || String(url||'').match(/\/d\/([\w-]+)/);
  return m ? ('https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400') : String(url||'');
}
// Phone photos are several MB - shrink to max 1280px JPEG (~150-300 KB) before uploading.
function compressImageFile_(file, cb){
  const reader = new FileReader();
  reader.onerror = function(){ cb(null); };
  reader.onload = function(){
    const img = new Image();
    img.onerror = function(){ cb(null); };
    img.onload = function(){
      const max = 1280; let w = img.width, h = img.height;
      if(w > max || h > max){ const r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = cv.toDataURL('image/jpeg', 0.75);
      cb({ dataUrl: dataUrl, base64: dataUrl.split(',')[1] });
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function pickLeadPhoto_(prefix){ const f = q('#'+prefix+'PhotoFile'); if(f) f.click(); }
function onLeadPhotoPicked_(prefix, input){
  const file = input.files && input.files[0]; if(!file) return;
  if(!/^image\//.test(file.type)){ showToast('Please choose an image file.', 'err'); input.value=''; return; }
  const st = prefix === 'ac' ? AC_PHOTO_ : EL_PHOTO_;
  const prev = q('#'+prefix+'PhotoPrev'), status = q('#'+prefix+'PhotoStatus');
  st.url = ''; st.uploading = true;
  if(status) status.textContent = 'Preparing photo...';
  compressImageFile_(file, function(res){
    if(!res){ st.uploading = false; if(status) status.textContent = 'Could not read this image.'; showToast('Could not read this image.', 'err'); return; }
    if(prev){ prev.src = res.dataUrl; prev.classList.remove('hidden'); }      // instant local preview
    if(status) status.textContent = 'Uploading...';
    const nameEl = q(prefix === 'ac' ? '#acName' : '#elName');
    google.script.run
      .withSuccessHandler(function(r){
        st.uploading = false;
        if(r && r.success){ st.url = r.url; if(status) status.textContent = '✔ Photo ready'; }
        else { if(status) status.textContent = 'Upload failed'; showToast((r && r.message) || 'Photo upload failed.', 'err'); }
      })
      .withFailureHandler(function(err){ st.uploading = false; if(status) status.textContent = 'Upload failed'; onEmployeeSessionError(err); })
      .apiEmployeeUploadLeadPhoto(ETOKEN, res.base64, 'image/jpeg', nameEl ? nameEl.value : '');
  });
}

// Instant: the modal closes and the table updates immediately; the location
// capture and the sheet save continue in the background (same idea as the
// status dropdown). If the save fails, the old value comes back + an error toast.
function saveVisit_(customerId){
  const notes = q('#visitNotes').value.trim();
  const c = findCustomerInCache_(customerId);
  const prev = c ? { lastLogVisitRaw:c.lastLogVisitRaw, lastVisitDateRaw:c.lastVisitDateRaw, lastVisitDate:c.lastVisitDate } : null;
  const nowMs = Date.now();
  closeModal();
  if(c){                                               // optimistic - "Last Visit" updates right now
    c.lastLogVisitRaw = nowMs;
    if(nowMs > (Number(c.lastVisitDateRaw)||0)){ c.lastVisitDateRaw = nowMs; c.lastVisitDate = mcFmtDate_(nowMs); }
    paintMyCustomers_();
  }
  showToast('Visit logged.', 'ok');
  EMP_DASH_LOADED_ = false;                            // dashboard "Today's Activity" refetches when next opened
  const revert = function(){
    const cur = findCustomerInCache_(customerId);
    if(cur && prev){ cur.lastLogVisitRaw = prev.lastLogVisitRaw; cur.lastVisitDateRaw = prev.lastVisitDateRaw; cur.lastVisitDate = prev.lastVisitDate; paintMyCustomers_(); }
  };
  captureLocation_().then(function(loc){
    google.script.run
      .withSuccessHandler(function(res){
        if(res && res.success){
          refreshMyCustomersSilently_();
          if(res.verification === 'INSIDE') showToast('Verified: INSIDE shop ('+res.distance+' m)', 'ok');
          else if(res.verification === 'OUTSIDE') showToast('Visit is OUTSIDE the shop radius ('+res.distance+' m from shop)', 'err');
          else showToast('Location unavailable - visit saved without verification.');
        }
        else { revert(); showToast((res && res.message) || 'Visit could not be saved. Please try again.', 'err'); }
      })
      .withFailureHandler(function(err){ revert(); onEmployeeSessionError(err); })
      .apiEmployeeAddVisit(ETOKEN, customerId, loc.lat, loc.lng, notes, loc.acc);
  });
}

// NEW: 📍 Location icon - opens Google Maps DIRECTIONS to the customer.
// No API key / paid integration needed - plain Google Maps URL scheme.
// Prefers the saved Lat,Long (exact pin); falls back to the saved
// Address text if no Lat,Long is on file; shows a message if neither exists.
function openCustomerLocation_(latLong, address){
  const s = String(latLong||'').trim();
  if(s){
    const parts = s.split(',');
    if(parts.length===2 && !isNaN(parseFloat(parts[0])) && !isNaN(parseFloat(parts[1]))){
      window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(parts[0].trim()+','+parts[1].trim()), '_blank');
      return;
    }
  }
  const a = String(address||'').trim();
  if(a){
    window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a), '_blank');
    return;
  }
  showToast('Address not available for this customer.', 'err');
}

function fmtAmPm_(t){ // 'HH:mm:ss' (or any string containing it) -> '09:42 AM'
  if(!t) return '—';
  const m = String(t).match(/(\d{1,2}):(\d{2})/); // NEW: defensive extraction, same idea as normalizeAttTimeKey_ server-side
  if(!m) return '—';
  const hh = Number(m[1]), mm = Number(m[2]);
  let h = hh % 12; if(h===0) h = 12;
  const ampm = hh < 12 ? 'AM' : 'PM';
  return (h<10?'0'+h:h)+':'+(mm<10?'0'+mm:mm)+' '+ampm;
}

function shiftAttHistoryMonth_(delta){
  const parts = ATT_HISTORY_MONTH.split('-').map(Number);
  const d = new Date(parts[0], parts[1]-1+delta, 1);
  ATT_HISTORY_MONTH = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  loadAttendanceHistory_();
}
function loadAttendanceHistory_(){
  q('#attHistGrid').innerHTML = '<div class="skeleton"></div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(!res || !res.success){ q('#attHistGrid').innerHTML = '<div class="empty-state">Failed to load.</div>'; return; }
      paintAttendanceHistory_(res);
    })
    .withFailureHandler(function(){ q('#attHistGrid').innerHTML = '<div class="empty-state">Failed to load.</div>'; })
    .apiEmployeeGetAttendanceHistory(ETOKEN, ATT_HISTORY_MONTH);
}
function paintAttendanceHistory_(res){
  const parts = res.monthKey.split('-').map(Number);
  q('#attHistMonthLabel').textContent = new Date(parts[0], parts[1]-1, 1).toLocaleString('default',{month:'long', year:'numeric'});
  const firstDow = new Date(parts[0], parts[1]-1, 1).getDay();
  let html = ['S','M','T','W','T','F','S'].map(function(d){ return '<div style="text-align:center;font-size:10px;color:var(--text-3);font-weight:700;">'+d+'</div>'; }).join('');
  for(let i=0;i<firstDow;i++) html += '<div></div>';
  res.days.forEach(function(d){
    const color = d.status==='Present' ? '#16a34a' : (d.status==='Absent' ? '#dc2626' : '#98a2b3');
    const bg = d.status==='Present' ? '#ecfdf3' : (d.status==='Absent' ? '#fef2f2' : '#f6f7fb');
    html += '<div title="'+esc(d.status)+(d.checkInTime?(' - In: '+esc(d.checkInTime)):'')+'" style="text-align:center;padding:6px 0;border-radius:8px;background:'+bg+';color:'+color+';font-size:12px;font-weight:600;">'+d.day+'</div>';
  });
  q('#attHistGrid').innerHTML = html;
}

function paintAttendanceCard_(res){
  const card = q('#attCard');
  if(!card) return;
  if(ATTENDANCE_TIMER_){ clearInterval(ATTENDANCE_TIMER_); ATTENDANCE_TIMER_ = null; }

  if(!res || !res.checkedIn){
    card.innerHTML =
      '<div class="att-status">You have not checked in today.</div>' +
      '<div class="att-timer">--:--:--</div>' +
      '<button class="btn btn-primary" id="attBtn" onclick="doCheckIn_()">Check In</button>';
    return;
  }
  if(res.checkedOut){
    card.innerHTML =
      '<div class="att-status">Checked in at '+esc(res.checkInTime)+', checked out at '+esc(res.checkOutTime)+'.</div>' +
      '<div class="att-timer">Done for today ✅</div>' +
      '<button class="btn btn-ghost" disabled>Attendance Complete</button>';
    return;
  }
  // checked in, not yet checked out - show a live-running timer
  card.innerHTML =
    '<div class="att-status">Checked in at '+esc(res.checkInTime)+'.</div>' +
    '<div class="att-timer" id="attTimerText">00:00:00</div>' +
    '<button class="btn btn-danger" id="attBtn" onclick="doCheckOut_()">Check Out</button>';
  const parts = String(res.checkInTime||'0:0:0').split(':').map(Number);
  const checkInMs = new Date();
  checkInMs.setHours(parts[0]||0, parts[1]||0, parts[2]||0, 0);
  ATTENDANCE_TIMER_ = setInterval(function(){
    const diff = Math.max(0, Date.now() - checkInMs.getTime());
    const h = String(Math.floor(diff/3600000)).padStart(2,'0');
    const m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
    const s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
    const el = q('#attTimerText'); if(el) el.textContent = h+':'+m+':'+s;
  }, 1000);
}

// NEW: formats CD as "5%" or "₹200"; '' when no CD
function fmtOrderCd_(type, val){
  const v = Number(val);
  if(!(v > 0)) return '';
  return type === '₹' ? ('₹' + v) : (v + '%');
}

// NEW: single source of truth for the order WhatsApp message
// (used by the Order Created popup AND the Orders tab)
function buildOrderWhatsAppMsg_(o){
  const DIV = '━━━━━━━━━━━━';
  const label = (o.orderFor === 'Lead' || o.entityType === 'lead') ? 'Lead' : 'Customer';
  const name = String(o.customerName || '').replace(/\*/g, '').trim();
  const area = String(o.customerArea || '').replace(/\*/g, '').trim();
  const mobile = String(o.customerMobile || '').trim();
  const ll = String(o.customerLatLong || '').replace(/\s+/g, '');   // spaces would break the link

   const showMoney = !!o.cash || !!fmtOrderCd_(o.cdType, o.cdValue);
  let msg = 'ORDER DETAILS' + (showMoney ? ' 💰💰💰' : '') + '\n' + DIV + '\n';
  msg += '*' + label + ': ' + name + (area ? ',' + area : '') + '*\n';
  if(mobile) msg += 'Mobile No.: ' + mobile + '\n';
  if(ll) msg += 'Location: https://maps.google.com/?q=' + ll + '\n';
  if(o.cash) msg += '*Payment: Cash*\n';                                                        // CASH/CD
  const cd = fmtOrderCd_(o.cdType, o.cdValue);                                                  // CASH/CD
  if(cd) msg += '*Cash Discount: ' + cd + '*\n';                                                // CASH/CD

  msg += '\nORDER ITEMS\n' + DIV + '\n';
  msg += (o.items || []).map(function(it, i){
    const remark = String(it.remark == null ? '' : it.remark).trim();   // empty/null/undefined/spaces -> ''
    const pname = String(it.productName || '').replace(/\*/g, '').trim();
    return (i+1) + '. *' + pname + '*\n   *Qty: ' + it.quantity + '*' + (remark ? ', ' + remark : '');
  }).join('\n\n');
  return msg;
}

    '<div class="page-header"><div><h2>🗺️ Shop View</h2><p>'+(svLeads_ ? 'Your assigned leads plotted on a map (Converted / Customer leads are hidden).' : 'All your customers plotted on a map.')+'</p></div>' +
      '<label class="mc-toggle" title="ON = Customers, OFF = Leads"><span id="svToggleLbl">'+(svLeads_ ? 'LEADS' : 'CUSTOMERS')+'</span><input type="checkbox" id="svModeToggle"'+(svLeads_ ? '' : ' checked')+' onchange="toggleSvMode_(this.checked)"><span class="mc-slider"></span></label>' +
    '</div>' +
    '<div class="filters-bar"><input type="text" id="svSearch" placeholder="'+(svLeads_ ? 'Search lead...' : 'Search customer / shop...')+'" oninput="svFilterMarkers_()" onkeydown="if(event.key===\'Enter\')svGoToFirstMatch_()"></div>' +
    '<div id="shopViewMapWrap" class="shopview-map-wrap">' +
      '<div id="shopMap" class="shopview-map"></div>' +
      '<div class="sv-controls">' +
        '<button class="sv-ctrl-btn" id="svLayerBtn" title="Toggle Satellite" onclick="svToggleLayer_()">🛰️ Satellite</button>' +
        '<button class="sv-ctrl-btn" title="Fit all shops" onclick="svFitAll_()">⤢ Fit All</button>' +
        '<button class="sv-ctrl-btn" title="My current location" onclick="svLocateMe_()">📍 My Location</button>' +
        '<button class="sv-ctrl-btn" title="Fullscreen" onclick="toggleShopMapFullscreen_()">⛶ Fullscreen</button>' +
      '</div>' +
      '<div class="sv-legend"><span>'+(svLeads_ ? '🟠 Lead' : '🔵 Shop')+'</span><span>📍 You</span></div>' +
      '<div id="svLoading" class="sv-loading">Loading map…</div>' +
    '</div>' +
    '<div id="svEmpty" class="empty-state hidden">'+(svLeads_ ? 'No assigned leads with a saved location yet (Converted / Customer leads are not shown). Add a Lat,Long from My Assigned Leads first.' : 'No customers with a saved location yet. Add a Lat,Long from My Customers first.')+'</div>';

  if(SHOP_MAP_){ SHOP_MAP_.remove(); SHOP_MAP_ = null; }

  if(svLeads_){ svLoadLeadsMode_(); return; }   // NEW - Leads mode; Customers mode below is unchanged

  if(SHOP_VIEW_LOADED_){ svInitMap_(SHOP_VIEW_CACHE); return; }

  google.script.run
    .withSuccessHandler(function(list){
      SHOP_VIEW_CACHE = list || [];
      SHOP_VIEW_LOADED_ = true;
      svInitMap_(SHOP_VIEW_CACHE);
    })
    .withFailureHandler(function(err){
      onEmployeeSessionError(err);
      const el = q('#svLoading'); if(el) el.textContent = 'Failed to load map.';
    })
    .apiEmployeeGetShopViewCustomers(ETOKEN);
}

function svInitMap_(list){
  const wrap = q('#shopViewMapWrap');
  if(!wrap) return;
  const valid = (list||[]).filter(function(c){ return typeof c.lat==='number' && typeof c.lng==='number'; });
  const loadingEl = q('#svLoading'); if(loadingEl) loadingEl.remove();
  if(!valid.length){
    wrap.classList.add('hidden');
    q('#svEmpty').classList.remove('hidden');
    return;
  }

  SV_ME_MARKER_ = null;
  SHOP_MAP_ = L.map('shopMap', { zoomControl:true });
  SV_OSM_LAYER_ = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(SHOP_MAP_);
  SV_SAT_LAYER_ = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom:19, attribution:'Tiles &copy; Esri'
  });
  SV_SAT_ON_ = false;

  SV_CLUSTER_ = L.markerClusterGroup({ maxClusterRadius:60 });
  SV_MARKERS_ = [];
  valid.forEach(function(c){
    const icon = L.divIcon({ className:'sv-shop-icon', html:(c.isLead ? '🟠' : '🔵'), iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-10] });
    const marker = L.marker([c.lat, c.lng], { icon:icon });
    marker.bindPopup(c.isLead ? svLeadPopupHtml_(c) : svPopupHtml_(c), { maxWidth:280 });
    marker._svData = c;
    SV_CLUSTER_.addLayer(marker);
    SV_MARKERS_.push(marker);
  });
  SHOP_MAP_.addLayer(SV_CLUSTER_);
  svFitAll_();
  setTimeout(function(){ if(SHOP_MAP_) SHOP_MAP_.invalidateSize(); }, 150);
}

function svPopupHtml_(c){
  const lastOrder = c.lastSaleDate ? (money(c.lastSaleAmount)+' / '+c.lastSaleDate) : '—';
  return '<div class="sv-popup">' +
    '<div class="sv-popup-title">'+esc(c.customerName)+'</div>' +
    svPopupRow_('Customer Name', c.ownerName || c.customerName || '—') +
    svPopupRow_('Mobile', c.mobile||'—') +
    svPopupRow_('Address', c.address||c.area||'—') +
    (c.shopType ? svPopupRow_('Customer Type', c.shopType) : '') +
    svPopupRow_('Last Order', lastOrder) +
    svPopupRow_('Total Business', money(c.totalBusiness)) +
    svPopupRow_('Outstanding', money(c.outstanding)) +
    svPopupRow_('Last Visit', c.lastVisitDate||'—') +
    '<div class="sv-popup-actions">' +
      '<button class="btn btn-secondary" style="flex:1" onclick="openCustomerProfile(\''+esc(c.customerId)+'\')">View Customer</button>' +
      '<button class="btn btn-ghost" style="flex:1" onclick="openCustomerLocation_(\''+esc(c.latLong)+'\',\''+esc(c.address||'')+'\')">Directions</button>' +
    '</div>' +
  '</div>';
}
function svPopupRow_(label, value){
  return '<div class="sv-popup-row"><span class="k">'+esc(label)+'</span><span class="v">'+esc(value)+'</span></div>';
}

/* ---- NEW: Shop View - Customers / Leads toggle ---- */
function toggleSvMode_(on){
  if(q('#svLoading')){                       // map still loading - don't switch mid-flight
    const t = q('#svModeToggle'); if(t) t.checked = (SV_MODE_ === 'customers');
    showToast('Map is still loading…');
    return;
  }
  SV_MODE_ = on ? 'customers' : 'leads';
  renderShopView();
}

function svLoadLeadsMode_(){
  if(MY_LEADS_LOADED_){ svInitMap_(svLeadMapItems_()); return; }
  google.script.run
    .withSuccessHandler(function(list){
      MY_LEADS_CACHE = list || []; MY_LEADS_LOADED_ = true;
      if(SV_MODE_ !== 'leads' || !q('#shopViewMapWrap')) return;   // user already moved on
      svInitMap_(svLeadMapItems_());
    })
    .withFailureHandler(function(err){
      onEmployeeSessionError(err);
      const el = q('#svLoading'); if(el) el.textContent = 'Failed to load map.';
    })
    .apiEmployeeGetMyLeads(ETOKEN);
}

// Assigned leads that have a valid saved Lat,Long. Leads whose status is
// Converted or Customer are NOT shown as lead markers. Fields are mapped to
// the same names the existing map search uses (customerName / mobile / area).
function svLeadMapItems_(){
  return (MY_LEADS_CACHE || []).filter(function(l){
    const st = String(l.status || '').trim();
    return st !== 'Converted' && st !== 'Customer';
  }).map(function(l){
    const ll = String(l.latLong || '').replace(/\s+/g, '');
    if(!isValidLatLong_(ll)) return null;
    const p = ll.split(',');
    return {
      isLead: true, leadId: l.leadId, customerName: l.name || '', mobile: l.phoneNo || '',
      area: l.area || '', address: l.address || '', status: l.status || '',
      latLong: ll, lat: Number(p[0]), lng: Number(p[1]),
      lastNote: l.lastNote || '', lastActivityDate: l.lastActivityDate || ''
    };
  }).filter(Boolean);
}

function svLeadPopupHtml_(c){
  const note = String(c.lastNote || '');
  return '<div class="sv-popup">' +
    '<div class="sv-popup-title">'+esc(c.customerName)+'</div>' +
    svPopupRow_('Phone', c.mobile||'—') +
    svPopupRow_('Address', c.address||c.area||'—') +
    svPopupRow_('Status', leadStatusLabel_(c.status)) +
    svPopupRow_('Last Activity', c.lastActivityDate||'—') +
    svPopupRow_('Last Note', note ? (note.length>80 ? note.substring(0,80)+'...' : note) : '—') +
    '<div class="sv-popup-actions">' +
      '<button class="btn btn-secondary" style="flex:1" onclick="openLeadDetail_(\''+esc(c.leadId)+'\')">View Lead</button>' +
      '<button class="btn btn-ghost" style="flex:1" onclick="openCustomerLocation_(\''+esc(c.latLong)+'\',\''+esc(c.address||'')+'\')">Directions</button>' +
    '</div>' +
  '</div>';
}

function svToggleLayer_(){
  if(!SHOP_MAP_) return;
  SV_SAT_ON_ = !SV_SAT_ON_;
  if(SV_SAT_ON_){ SHOP_MAP_.removeLayer(SV_OSM_LAYER_); SHOP_MAP_.addLayer(SV_SAT_LAYER_); q('#svLayerBtn').innerHTML='🗺️ Map'; }
  else { SHOP_MAP_.removeLayer(SV_SAT_LAYER_); SHOP_MAP_.addLayer(SV_OSM_LAYER_); q('#svLayerBtn').innerHTML='🛰️ Satellite'; }
}

function svFitAll_(){
  if(!SHOP_MAP_ || !SV_MARKERS_.length) return;
  const bounds = L.latLngBounds(SV_MARKERS_.map(function(m){ return m.getLatLng(); }));
  SHOP_MAP_.fitBounds(bounds, { padding:[30,30] });
}

function svLocateMe_(){
  if(!SHOP_MAP_) return;
  showToast('Getting your location…');
  captureLocation_().then(function(loc){
    if(!loc.lat || !loc.lng){ showToast('Could not get current location.', 'err'); return; }
    if(SV_ME_MARKER_) SHOP_MAP_.removeLayer(SV_ME_MARKER_);
    const meIcon = L.divIcon({ className:'sv-me-icon', html:'📍', iconSize:[26,26], iconAnchor:[13,26], popupAnchor:[0,-24] });
    SV_ME_MARKER_ = L.marker([loc.lat, loc.lng], { icon:meIcon }).addTo(SHOP_MAP_);
    SV_ME_MARKER_.bindPopup('Your current location').openPopup();
    SHOP_MAP_.setView([loc.lat, loc.lng], 15);
  });
}

function toggleShopMapFullscreen_(){
  const el = q('#shopViewMapWrap');
  if(!el) return;
  if(!document.fullscreenElement){
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}
document.addEventListener('fullscreenchange', function(){
  setTimeout(function(){ if(SHOP_MAP_) SHOP_MAP_.invalidateSize(); }, 120);
});

function svFilterMarkers_(){
  if(!SHOP_MAP_ || !SV_CLUSTER_) return;
  const term = (q('#svSearch')?q('#svSearch').value:'').trim().toLowerCase();
  SV_CLUSTER_.clearLayers();
  SV_MARKERS_.forEach(function(m){
    const c = m._svData;
    if(!term || String(c.customerName||'').toLowerCase().indexOf(term)>-1 || String(c.mobile||'').indexOf(term)>-1 || String(c.area||'').toLowerCase().indexOf(term)>-1){
      SV_CLUSTER_.addLayer(m);
    }
  });
}

function svGoToFirstMatch_(){
  const term = (q('#svSearch')?q('#svSearch').value:'').trim().toLowerCase();
  if(!term || !SHOP_MAP_) return;
  const found = SV_MARKERS_.find(function(m){
    const c = m._svData;
    return String(c.customerName||'').toLowerCase().indexOf(term)>-1 || String(c.mobile||'').indexOf(term)>-1;
  });
  if(found){ SHOP_MAP_.setView(found.getLatLng(), 17); found.openPopup(); }
  else showToast('No matching shop found.', 'err');
}
</script>

<script>
(function () {
  try {
    var ua = navigator.userAgent || '';
    var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    var dismissed = false;
    try { dismissed = localStorage.getItem('iosHintDismissed') === '1'; } catch (e) {}
    if (!isIOS || standalone || dismissed) return;
    var box = document.getElementById('iosInstallHint');
    var btn = document.getElementById('iosHintClose');
    if (!box || !btn) return;
    setTimeout(function () { box.style.display = 'block'; }, 1500);
    btn.addEventListener('click', function () {
      box.style.display = 'none';
      try { localStorage.setItem('iosHintDismissed', '1'); } catch (e) {}
    });
  } catch (e) {}
})();
</script>
<!-- NEW: iPhone installed-app fix - open WhatsApp / Maps directly in their apps (no in-app browser sheet). Runs ONLY on iOS + installed app; everything else unchanged -->
<script>
(function () {
  try {
    var ua = navigator.userAgent || '';
    var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (!isIOS || !standalone) return;

    function toNative(href) {
      try {
        var u = new URL(href, location.href);
        var h = u.hostname.replace(/^www\./, '');
        var p = u.searchParams, parts = [];
        if (h === 'wa.me' || (h === 'api.whatsapp.com' && u.pathname === '/send')) {
          var num = (h === 'wa.me' ? u.pathname : (p.get('phone') || '')).replace(/\D/g, '');
          var txt = p.get('text');
          if (num) parts.push('phone=' + num);
          if (txt) parts.push('text=' + encodeURIComponent(txt));
          return 'whatsapp://send' + (parts.length ? '?' + parts.join('&') : '');
        }
        if ((h === 'google.com' && u.pathname.indexOf('/maps') === 0) || h === 'maps.google.com') {
          var dest = p.get('destination'), org = p.get('origin'), q = p.get('query') || p.get('q');
          if (!dest && !q) {
            var seg = u.pathname.split('/').filter(Boolean);
            var bad = seg.some(function (s) { return s.charAt(0) === '@' || s.indexOf('data=') === 0; });
            if (!bad && seg[1] === 'dir' && seg.length >= 3 && seg.length <= 4) {
              dest = decodeURIComponent(seg[seg.length - 1]);
              if (seg.length === 4) org = decodeURIComponent(seg[2]);
            }
          }
          if (dest) {
            parts.push('daddr=' + encodeURIComponent(dest));
            if (org) parts.push('saddr=' + encodeURIComponent(org));
            parts.push('dirflg=d');
          } else if (q) {
            parts.push('q=' + encodeURIComponent(q));
          } else { return null; }
          return 'maps://?' + parts.join('&');
        }
      } catch (e) {}
      return null;
    }

    var _open = window.open;
    window.open = function (url) {
      try {
        var n = url ? toNative(String(url)) : null;
        if (n) { window.location.href = n; return null; }
      } catch (e) {}
      return _open.apply(window, arguments);
    };

    document.addEventListener('click', function (ev) {
      try {
        var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
        if (!a) return;
        var n = toNative(a.getAttribute('href'));
        if (n) { ev.preventDefault(); window.location.href = n; }
      } catch (e) {}
    }, true);
  } catch (e) {}
})();
</script>
