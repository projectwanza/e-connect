.stph{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;margin-bottom:12px}.stph i{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-size:13px;display:flex;align-items:center;justify-content:center}

#bar{position:fixed;top:0;left:0;height:3px;background:var(--or);width:0;z-index:999;transition:width .3s}

.fin{max-width:1200px;margin:auto;display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}.fin b{display:block;color:#fff;margin-bottom:8px}.fin a{display:block;padding:3px 0}.fin a:hover{color:#fff}.fin p{margin:0;max-width:320px}.fbr{font-size:20px}
.fcp{max-width:1200px;margin:24px auto 0;padding-top:16px;border-top:1px solid #2c2c31;text-align:center;font-size:12px}
.auth{max-width:420px;margin:30px auto}.auth .tabs{display:flex;margin-bottom:10px}.auth .tabs a{flex:1;text-align:center;padding:10px;border-bottom:2px solid var(--bo);font-weight:600}.auth .tabs a.on{border-color:var(--or);color:var(--or)}
.lnk{color:var(--or);cursor:pointer;font-weight:600;font-size:13px}
@media(max-width:820px){.hin{flex-wrap:wrap;gap:10px 12px}.logo{order:1;flex:1}#acct{order:2}.cartl{order:3}.sbox{order:4;flex:0 0 100%;max-width:none}.lay,.pg,.two,.acc{grid-template-columns:1fr}.fil{display:none}.fil.show{display:block}.slider{height:200px;border-radius:16px}.slide h2{font-size:22px}.slide p{font-size:13px;margin-bottom:12px}.zoom{height:290px}.gal{flex-direction:column-reverse}.thumbs{flex-direction:row}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.hrow .card{min-width:165px;max-width:165px}.lcard{flex-direction:column}.cbtn{flex-direction:column}.trust{grid-template-columns:1fr 1fr}.fin{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}.two>.box:last-child{position:static}.cimg{height:140px}.box{padding:16px}}

<body>
<div id="bar"></div>
<header><div class="hin">
  <a class="logo" href="#/"><img src="logo.png" alt="A&amp;R" onerror="this.style.display='none'"><span id="lg">E Connect</span><small id="tg"></small></a>
  <div class="sbox"><input id="q" placeholder="Search chargers, cables, earphones..." autocomplete="off" oninput="sugg()" onkeydown="if(event.key==='Enter')doSearch()"><button onclick="doSearch()" aria-label="Search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button><div id="sug" style="display:none"></div></div>
  <div id="acct"></div>

</div></header>

<script>
var S={cfg:{categories:[],banners:[]},user:null,token:null,cart:[],wish:[],buy:null,coupon:'',timer:0,after:'',mem:{}};
var STEPS=['Order Placed','Confirmed','Processing','Packed','Shipped','Out for Delivery','Delivered'];
var EMO={'Chargers':'\uD83D\uDD0C','USB Cables':'\uD83D\uDD17','Earphones':'\uD83C\uDFA7','Neckbands':'\uD83C\uDFA7'};
function $(i){return document.getElementById(i)}
function h(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '\u20B9'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function ls(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x?JSON.parse(x):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){if(v===undefined)return S.mem[k]||null;S.mem[k]=v}}
function go(x){if(location.hash===x)route();else location.hash=x}
function dt(s){var d=new Date(s);return isNaN(d)?'':d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function toast(m,e){var t=$('toast');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},3200)}
var busy=0;function prog(on){busy+=on?1:-1;var b=$('bar');b.style.width=busy>0?'70%':'100%';if(busy<=0)setTimeout(function(){b.style.width='0'},300)}
/* >>> PASTE YOUR APPS SCRIPT WEB APP URL HERE (ends with /exec) <<< */
var GAS_URL='https://script.google.com/macros/s/PASTE_YOUR_DEPLOYMENT_ID_HERE/exec';
function raw(a,p){
  if(window.google&&google.script&&google.script.run)return new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(new Error(e&&e.message||'Network error'))}).api(a,p||{},S.token)});
  return fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:a,payload:p||{},token:S.token})}).then(function(r){return r.json()}).catch(function(){throw new Error('Network error. Please check your connection.')});
}
function api(a,p){prog(1);return raw(a,p).then(function(r){prog(0);if(r&&r.ok)return r.data;if(r&&r.error==='AUTH'){clearAuth();go('#/login');throw new Error('Please login again')}throw new Error(r?r.error:'Server error')},function(e){prog(0);throw e})}
function tc(fn){return Promise.resolve().then(fn).catch(function(e){toast(e.message,1)})}
function modal(x){$('modal').innerHTML='<div class="mback" onclick="if(event.target===this)closeM()"><div class="mbox">'+x+'</div></div>'}
function closeM(){$('modal').innerHTML=''}
function ask(title,label,okTxt){return new Promise(function(res){window._ar=res;modal('<h3>'+h(title)+'</h3>'+(label?'<label>'+h(label)+'</label><textarea id="askv" rows="3"></textarea>':'')+'<div class="mact"><button class="btn" onclick="closeM();_ar(null)">Cancel</button><button class="btn buy" onclick="var e=document.getElementById(\'askv\');var v=e?e.value.trim():true;if(e&&!v){return}closeM();_ar(v)">'+(okTxt||'OK')+'</button></div>')})}
function openHtml(x){var w=null;try{w=window.open('','_blank')}catch(e){}if(w){w.document.write(x);w.document.close();setTimeout(function(){try{w.print()}catch(e){}},500)}else{modal('<iframe id="ifr" style="width:100%;height:60vh;border:1px solid #ddd"></iframe><div class="mact"><button class="btn" onclick="closeM()">Close</button><button class="btn pri" onclick="try{ifr.contentWindow.print()}catch(e){toast(\'Use Ctrl+P to print\')}">Print</button></div>');$('ifr').srcdoc=x}}
function parseHash(){var x=location.hash.slice(1)||'/',i=x.indexOf('?'),p=i<0?x:x.slice(0,i),q={};if(i>=0)x.slice(i+1).split('&').forEach(function(kv){var a=kv.split('=');if(a[0])q[a[0]]=decodeURIComponent((a[1]||'').replace(/\+/g,' '))});return{path:p.split('/').filter(Boolean),q:q}}
function qs(o){return Object.keys(o).filter(function(k){return o[k]!==''&&o[k]!==undefined&&o[k]!==false&&o[k]!==null}).map(function(k){return k+'='+encodeURIComponent(o[k])}).join('&')}

/* ---------- session ---------- */
function setAuth(d){S.token=d.token;S.user=d.user;ls('tok',d.token);loadWish();updateHeader()}
function clearAuth(){S.token=null;S.user=null;S.wish=[];ls('tok','');updateHeader()}
function logout(){api('logout').catch(function(){});clearAuth();go('#/');toast('Logged out')}
function loadWish(){if(!S.token)return;api('wishlist').then(function(d){S.wish=d.ids}).catch(function(){})}
function updateHeader(){
  $('cc').textContent=S.cart.reduce(function(s,i){return s+i.qty},0);
  $('acct').innerHTML=S.user?'<div class="dd"><span class="hl" tabindex="0">'+h(S.user.name.split(' ')[0])+' &#9662;</span><div class="ddm"><a href="#/account/profile">My Profile</a><a href="#/account/orders">My Orders</a><a href="#/account/wishlist">Wishlist</a><a href="#/account/wallet">Wallet ('+money(S.user.wallet+S.user.cashback)+')</a><a href="#/account/addresses">Addresses</a><a onclick="logout()" style="cursor:pointer">Logout</a></div></div>':'<a class="hbtn" href="#/login">Login</a>';
}

function placeOrder(){tc(async function(){
  var k=S.ck,q=k.q,p={items:k.items,coupon:S.coupon,useWallet:!!k.useWallet,addressId:k.addr,payMethod:q.payable>0?k.pay:'WALLET'};

function recharge(){tc(async function(){var a=+$('ra').value;if(!(a>=10))throw new Error('Minimum recharge is \u20B910');var o=await api('rzpOrder',{purpose:'RECHARGE',amount:a});await loadRzp();var x=await rzpPay(o,'Wallet recharge');S.user=await api('rechargeVerify',{rzp:{order_id:x.razorpay_order_id,payment_id:x.razorpay_payment_id,signature:x.razorpay_signature}});toast('Wallet recharged');route()})}
async function payH(){var ps=await api('payments');return '<div class="box"><h3 style="margin-top:0">Payment History</h3>'+(ps.length?'<div style="overflow-x:auto"><table><tr><th>Date</th><th>Order</th><th>Type</th><th>Method</th><th>Amount</th><th>Status</th><th>Ref</th></tr>'+ps.map(function(p){return '<tr><td>'+dt(p.CreatedAt)+'</td><td>'+h(p.OrderID||'-')+'</td><td>'+h(p.Type)+'</td><td>'+h(p.Method)+'</td><td>'+money(p.Amount)+'</td><td>'+h(p.Status)+'</td><td>'+h(p.Ref)+'</td></tr>'}).join('')+'</table></div>':'<p class="muted">No payments yet.</p>')+'</div>'}

/* ---------- boot ---------- */
async function boot(){
  S.cart=ls('cart')||[];S.coupon=ls('coupon')||'';S.token=ls('tok')||null;
  try{S.cfg=await api('config');
    document.title=S.cfg.storeName;$('lg').textContent=S.cfg.storeName;
    $('catn').innerHTML='<a href="#/">Home</a>'+S.cfg.categories.map(function(c){return '<a href="#/list?cat='+encodeURIComponent(c.name)+'">'+h(c.name)+'</a>'}).join('')+'<a href="#/list?sort=discount">Offers</a>';
    $('foot').innerHTML='<div class="fin"><div><b class="fbr">'+h(S.cfg.storeName)+'</b><p>'+h(S.cfg.tagline)+'</p></div><div><b>Shop</b>'+S.cfg.categories.map(function(c){return '<a href="#/list?cat='+encodeURIComponent(c.name)+'">'+h(c.name)+'</a>'}).join('')+'</div><div><b>Help</b><a href="#/account/orders">Track order</a><a href="#/account/profile">My account</a>'+(S.cfg.supportPhone?'<a href="tel:'+h(S.cfg.supportPhone)+'">'+h(S.cfg.supportPhone)+'</a>':'')+'<a id="pwa" style="display:none;cursor:pointer" onclick="installApp()">Install app</a></div></div><div class="fcp">&copy; '+new Date().getFullYear()+' '+h(S.cfg.storeName)+'. All rights reserved.</div>';
  }catch(e){$('app').innerHTML='<div class="box center err">Store is not set up yet. Run setup() in Code.gs. ('+h(e.message)+')</div>';return}
  if(S.token){try{S.user=await api('me');loadWish()}catch(e){clearAuth()}}
  updateHeader();route();pwaUi();
}
/* ---------- PWA (install support) ---------- */
var deferredInstall=null;
function pwaUi(){var b=$('pwa');if(!b)return;var st=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;if(st){b.style.display='none';return}b.style.display=(deferredInstall||/iphone|ipad|ipod/i.test(navigator.userAgent))?'block':'none'}
function installApp(){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(function(){deferredInstall=null;pwaUi()})}else toast('iPhone: tap Share, then Add to Home Screen')}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;pwaUi()});
window.addEventListener('appinstalled',function(){deferredInstall=null;pwaUi();toast('App installed')});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!(window.google&&google.script&&google.script.run)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
boot();
</script>
