<!DOCTYPE html>
<html>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Employee Portal</title>
  <!-- NEW: PWA install support -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#101828">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- NEW: Shop View map - Leaflet (free, no API key) + marker clustering -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <style>
    :root{
      --primary:#101828; --primary-accent:#2952e3; --primary-light:#eef2ff;
      --success:#16a34a; --success-bg:#ecfdf3;
      --danger:#dc2626; --danger-bg:#fef2f2;
      --warning:#d97706; --warning-bg:#fffbeb;
      --neutral-bg:#f6f7fb; --card-bg:#ffffff;
      --text-1:#101828; --text-2:#475467; --text-3:#98a2b3;
      --border:#e4e7ec;
      --radius:14px; --radius-sm:9px;
      --shadow-sm:0 1px 2px rgba(16,24,40,.05);
      --shadow-md:0 4px 12px rgba(16,24,40,.08);
      --shadow-lg:0 12px 32px rgba(16,24,40,.14);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--neutral-bg);color:var(--text-1);}
    button{font-family:inherit;cursor:pointer;}
    input,select,textarea{font-family:inherit;}
    .hidden{display:none !important;}

    #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
      background:linear-gradient(135deg,#0b1220 0%,#111827 60%,#1f2937 100%);}
    .login-card{width:100%;max-width:380px;background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);padding:34px 30px;}
    .login-card h1{font-size:20px;margin:0 0 4px;}
    .login-card p.sub{color:var(--text-2);font-size:13px;margin:0 0 22px;}
    .badge-emp{display:inline-block;background:#2952e3;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:14px;letter-spacing:.03em;}
    .field{margin-bottom:14px;}
    .field label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px;}
    .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;}
    .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary-accent);}
    .btn{border:none;border-radius:var(--radius-sm);padding:11px 16px;font-weight:600;font-size:13.5px;}
    .btn-primary{background:var(--primary);color:#fff;width:100%;}
    .btn-primary:hover{background:#000;}
    .btn-secondary{background:var(--primary-light);color:var(--primary-accent);}
    .btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text-2);}
    .btn-danger{background:var(--danger-bg);color:var(--danger);}
    .btn-success{background:var(--success-bg);color:var(--success);}
    .btn:disabled{opacity:.6;cursor:not-allowed;}
    .login-error{background:var(--danger-bg);color:var(--danger);padding:9px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;}

    #appShell{display:none;min-height:100vh;}
    .topbar{position:sticky;top:0;z-index:20;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;}
    .topbar span.title{font-weight:700;font-size:15px;}
    .topbar .badge-emp{margin:0 0 0 8px;}
    .topbar-right{display:flex;gap:10px;align-items:center;}
    .topbar-right button{background:rgba(255,255,255,.1);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:12.5px;}

    .tabs{display:flex;gap:4px;padding:14px 20px 0;max-width:900px;margin:0 auto;overflow-x:auto;}
    .tab-btn{padding:10px 16px;border:none;background:transparent;border-radius:10px 10px 0 0;font-size:13.5px;font-weight:600;color:var(--text-2);white-space:nowrap;}
    .tab-btn.active{background:#fff;color:var(--primary-accent);box-shadow:var(--shadow-sm);}

    .main{max-width:900px;margin:0 auto;padding:20px;}
    .page-header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
    .page-header h2{margin:0 0 4px;font-size:20px;}
    .page-header p{margin:0;color:var(--text-2);font-size:13px;}

    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px;}
    .stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);}
    .stat-card .label{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;margin-bottom:6px;}
    .stat-card .value{font-size:21px;font-weight:800;}

    .card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-sm);}
    .card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .card-header h3{margin:0;font-size:14.5px;}
    .card-body{padding:16px 18px;}

    .attendance-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow-sm);text-align:center;}
    .attendance-card .att-status{font-size:13px;color:var(--text-2);margin-bottom:14px;}
    .attendance-card .att-timer{font-size:28px;font-weight:800;margin-bottom:14px;font-variant-numeric:tabular-nums;}
    .attendance-card .btn{padding:13px 24px;font-size:14px;min-width:160px;}

    .att-day-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden;}
    .att-day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;cursor:pointer;font-weight:700;font-size:13.5px;}
    .att-day-total{color:var(--primary-accent);}
    .att-day-chevron{font-size:11px;color:var(--text-3);}
    .att-day-sub{padding:0 16px 10px;margin-top:-10px;font-size:12px;color:var(--text-3);}
    .att-day-body{max-height:0;overflow:hidden;transition:max-height .25s ease;border-top:1px solid transparent;}
    .att-day-card .att-day-body:not([style*="max-height: 0"]){border-top:1px solid var(--border);}
    .att-shift-row{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;font-size:13px;border-bottom:1px solid var(--border);}
    .att-shift-row:last-child{border-bottom:none;}
    .att-shift-label{color:var(--text-2);font-weight:600;min-width:60px;}
    .att-shift-dur{font-weight:700;}
    .att-shift-total{background:var(--neutral-bg);font-weight:800;}

    .filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
    .filters-bar input{padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;flex:1;min-width:180px;}
    /* NEW: My Customers ON/OFF toggle */
    .mc-toggle{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:11.5px;font-weight:700;letter-spacing:.4px;color:var(--text-2);user-select:none;}
    .mc-toggle input{position:absolute;opacity:0;width:0;height:0;}
    .mc-slider{position:relative;width:38px;height:22px;background:#cfd4dc;border-radius:22px;transition:background .2s;flex-shrink:0;}
    .mc-slider::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
    .mc-toggle input:checked + .mc-slider{background:var(--primary-accent);}
    .mc-toggle input:checked + .mc-slider::after{transform:translateX(16px);}
    /* NEW: Advanced Filter - compact multi-select dropdowns (Customer Status / Tags) */
    .mc-dd-wrap{position:relative;display:inline-block;max-width:100%;}
    .mc-dd-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:240px;max-width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fff;font-size:13px;cursor:pointer;text-align:left;}
    .mc-dd-btn:hover{border-color:var(--primary-accent);}
    .mc-dd-panel{position:absolute;left:0;top:calc(100% + 4px);z-index:60;min-width:270px;max-height:260px;overflow-y:auto;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;}
    .mc-dd-tools{display:flex;gap:14px;padding:4px 8px 6px;font-size:12px;font-weight:600;border-bottom:1px solid var(--border);margin-bottom:4px;}
    .mc-dd-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;font-size:13px;cursor:pointer;}
    .mc-dd-item:hover{background:var(--neutral-bg);}
    /* NEW: My Tasks */
    .mt-pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--neutral-bg);border:1px solid var(--border);white-space:nowrap;}
    .mt-pill.due{background:#fdecea;border-color:#f5b5ae;color:#b42318;}
    .mt-pill.soon{background:#fdf2d8;border-color:#f1d9a0;color:#8a5a00;}
    .mt-pill.done{background:#e7f6ec;border-color:#bfe3cb;color:#1d6f42;}
    .mt-sub{font-size:11.5px;color:var(--text-2);margin-top:2px;}
    .mt-wa-btn{display:inline-flex;align-items:center;gap:4px;color:#128c4a;background:#ecfdf3;border-color:#bfe3cb;}
    .mt-wa-btn:hover{background:#d1fae5;}
    .mt-wa-count{font-size:11px;font-weight:800;line-height:1;}
    .wa-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:8px;cursor:pointer;}
    .wa-opt:hover{border-color:#25D366;background:#f0fdf4;}
    .mt-filter{padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:#fff;}
        /* NEW: My Tasks date filter (mobile friendly) + Task Report */
    .mt-datebar{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;}
    .mt-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;}
    .mt-chip{flex:0 0 auto;padding:8px 14px;border:1.5px solid var(--border);border-radius:999px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
    .mt-chip.on{background:var(--primary-light);border-color:var(--primary-accent);color:var(--primary-accent);}
    .mt-date-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;}
    .mt-date-row label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--text-2);}
    .mt-date-row input[type=date],.mt-date-row select{min-height:42px;padding:9px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;background:#fff;width:100%;box-sizing:border-box;}
    .tr-sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
    .tr-card{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fff;}
    .tr-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:8px;}
    .tr-kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--border);}
    .tr-kv span{color:var(--text-2);}
    .tr-kv b{text-align:right;word-break:break-word;font-weight:600;}
    .tr-box{font-size:12.5px;background:var(--neutral-bg);border-radius:8px;padding:9px 10px;margin-top:8px;}
    .tr-det{margin-top:8px;font-size:13px;}
    .tr-det summary{cursor:pointer;font-weight:700;padding:6px 0;}
    @media (max-width:640px){
      /* Date range: Start | End on row 1, Filter by | Clear Filters on row 2 - nothing can overflow the screen */
      .mt-date-row{grid-template-columns:repeat(2,minmax(0,1fr));}
      .mt-date-row label{min-width:0;}
      .mt-date-row input[type=date],.mt-date-row select{min-width:0;max-width:100%;}
      .mt-date-row .btn{width:100%;}
      .tr-grid{grid-template-columns:1fr;}
      /* Search = full row; Due/Pending + All task types = SAME row, equal width */
      #mtSearch{flex:1 1 100%;min-width:0;}
      .filters-bar .mt-filter{flex:1 1 0;min-width:0;}
    }
    /* NEW: Assigned Leads table + Lead details */
    .lead-note-cell{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:var(--text-2);}
    .lead-link{cursor:pointer;color:var(--primary-accent);font-weight:600;}
    /* NEW: clickable Lead Status + compact dropdown */
    .lead-status{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);background:var(--neutral-bg);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
    .lead-status:hover{border-color:var(--primary-accent);color:var(--primary-accent);}
    .lead-status.saving{opacity:.7;pointer-events:none;}
    .lead-status-menu{position:fixed;z-index:9999;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:4px;min-width:170px;max-height:calc(100vh - 16px);overflow-y:auto;}
    .lead-status-menu button{display:block;width:100%;text-align:left;background:transparent;border:none;padding:7px 12px;font-size:13px;border-radius:6px;cursor:pointer;color:inherit;}
    .lead-status-menu button:hover{background:var(--neutral-bg);}
    .lead-status-menu button.current{background:var(--primary-light);color:var(--primary-accent);font-weight:700;}
    .lead-timeline{border-left:2px solid var(--border);margin-left:6px;padding-left:16px;}
    .lead-timeline .lt-item{position:relative;margin-bottom:16px;}
    .lead-timeline .lt-item::before{content:'';position:absolute;left:-23px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--primary-accent);}
    .lead-timeline .lt-time{font-size:11.5px;color:var(--text-3);font-weight:700;margin-bottom:2px;}
    .lead-timeline .lt-text{font-size:13.5px;white-space:pre-wrap;word-break:break-word;}
    /* NEW: activity-type badge + dot colour in the Lead timeline */
    .lead-timeline .lt-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin:1px 0 3px;background:var(--primary-light);color:var(--primary-accent);}
    .lead-timeline .lt-item.t-call::before{background:var(--success);}
    .lead-timeline .lt-item.t-call .lt-tag{background:var(--success-bg);color:var(--success);}
    .lead-timeline .lt-item.t-status::before,.lead-timeline .lt-item.t-edit::before{background:var(--warning);}
    .lead-timeline .lt-item.t-status .lt-tag,.lead-timeline .lt-item.t-edit .lt-tag{background:var(--warning-bg);color:var(--warning);}
    .lead-timeline .lt-item.t-convert::before,.lead-timeline .lt-item.t-create::before{background:var(--success);}
    .lead-timeline .lt-item.t-convert .lt-tag,.lead-timeline .lt-item.t-create .lt-tag{background:var(--success-bg);color:var(--success);}
    .lead-timeline .lt-item.t-remove::before{background:var(--danger);}
    .lead-timeline .lt-item.t-remove .lt-tag{background:var(--danger-bg);color:var(--danger);}
    .profile-grid .span2{grid-column:1 / -1;}
    /* NEW: Convert Lead modal + Converted History */
    .conv-type-row{display:flex;gap:16px;margin-bottom:14px;}
    .conv-type-row label{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;cursor:pointer;}
    .conv-cust-list{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}
    .conv-cust-row{padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer;}
    .conv-cust-row:last-child{border-bottom:none;}
    .conv-cust-row:hover{background:var(--neutral-bg);}
    .conv-cust-row.selected{background:var(--primary-light);}
    .conv-cust-row .ccr-name{font-weight:700;font-size:13.5px;}
    .conv-cust-row .ccr-sub{font-size:11.5px;color:var(--text-2);}
    .conv-badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:#fdf2d8;color:#8a5a00;font-size:10.5px;font-weight:700;}
    .conv-history-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
    .conv-history-card:last-child{margin-bottom:0;}
    /* NEW: Convert Lead - "Select Customer Details to Save" */
    .conv-fields-title{font-size:13px;font-weight:700;margin:0 0 4px;}
    .conv-fields-hint{font-size:11.5px;color:var(--text-2);margin:0 0 8px;}
    .conv-field-row{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;}
    .conv-field-row .cfr-label{font-weight:700;font-size:12.5px;margin-bottom:4px;}
    .conv-field-row .cfr-lead{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;cursor:pointer;word-break:break-word;}
    .conv-field-row .cfr-lead.off{color:var(--text-3);cursor:default;}
    .conv-field-row .cfr-cust{font-size:12.5px;color:var(--text-2);margin:3px 0 0 24px;word-break:break-word;}

    table{width:100%;border-collapse:collapse;font-size:13px;}
    thead th{text-align:left;padding:10px 12px;color:var(--text-3);font-weight:700;text-transform:uppercase;font-size:10.5px;border-bottom:1px solid var(--border);white-space:nowrap;}
    tbody td{padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
    .table-scroll{overflow-x:auto;}
    tbody tr:hover{background:var(--neutral-bg);}
    .orders-mobile-cards{display:none;}
    .customers-mobile-cards{display:none;}
    @media(max-width:640px){
      #ordersList table{display:none;}
      .orders-mobile-cards{display:block;}
      .order-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
      .order-card .oc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
      .order-card .oc-title{font-weight:700;font-size:14px;}
      .order-card .oc-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);margin-bottom:4px;}
      .order-card .oc-actions{display:flex;gap:8px;margin-top:10px;}
      .order-card .oc-actions .icon-btn{flex:1;text-align:center;}
      #mcList table{display:none;}
      #mlList table{display:none;}   /* NEW - leads: table hidden on mobile, card list (same as My Customers) shown instead */
      #mtList table{display:none;}   /* NEW - My Tasks: same card layout on mobile */
      .customers-mobile-cards{display:block;}
      .customer-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
      .customer-card .cc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;cursor:pointer;}
      .customer-card .cc-title{font-weight:700;font-size:14px;}
      .customer-card .cc-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);margin-bottom:4px;}
      .customer-card .cc-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
      .customer-card .cc-actions .icon-btn{flex:1;min-width:60px;text-align:center;}
    }
    tbody tr.clickable{cursor:pointer;}

    .icon-btn{border:1px solid var(--border);background:#fff;border-radius:7px;padding:6px 10px;font-size:13px;}
    .icon-btn.add-visit{color:var(--primary-accent);font-weight:800;}

    .badge{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;}
    .badge-active{background:var(--success-bg);color:var(--success);}
    .badge-inactive{background:var(--danger-bg);color:var(--danger);}

    .empty-state{text-align:center;padding:40px;color:var(--text-3);font-size:13px;}
    .skeleton{background:linear-gradient(90deg,#eef0f3 25%,#e4e7ec 37%,#eef0f3 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px;height:40px;margin-bottom:8px;}
    @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

    .modal-overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
    .modal{background:#fff;width:100%;max-width:460px;border-radius:16px;box-shadow:var(--shadow-lg);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;}
    .modal.modal-wide{max-width:720px;}
    .modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;}
    .modal-head h3{margin:0;font-size:15px;}
    .modal-close{border:none;background:var(--neutral-bg);width:28px;height:28px;border-radius:50%;}
    .modal-body{padding:18px 20px;flex:1 1 auto;overflow-y:auto;min-height:0;}
    .modal-actions{display:flex;gap:10px;padding:14px 20px;flex:0 0 auto;border-top:1px solid var(--border);}
        /* NEW: Create Order - Cash / CD row */
    .ord-opts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px;}

<script>
/* Cross-host bridge - identical pattern to Admin.html. If the page is
   opened directly from the Apps Script /exec URL, google.script.run
   already exists and this block does nothing. If hosted elsewhere
   (e.g. GitHub Pages), it polyfills google.script.run over fetch. */
(function(){
   var GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwqY1Xy4A8UB_IhV3hxszbZuOoJT985aERQiDLoh9V-c-qnp-81Wz1gULjsMpp9txuKkA/exec';

  if (window.google && window.google.script && window.google.script.run) return;
  window.google = window.google || {};
  window.google.script = window.google.script || {};

  function makeRunner(onOk, onErr){
    return new Proxy({}, {
      get: function(_, fnName){
        if (fnName === 'withSuccessHandler') return function(cb){ return makeRunner(cb, onErr); };
        if (fnName === 'withFailureHandler') return function(cb){ return makeRunner(onOk, cb); };
        if (fnName === 'withUserObject')     return function(){ return makeRunner(onOk, onErr); };
        return function(){
          var args = Array.prototype.slice.call(arguments);
          fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify({ fn: fnName, args: args }) })
            .then(function(r){ return r.json(); })
            .then(function(res){
              if (res.ok) { if (onOk) onOk(res.result); }
              else { if (onErr) onErr(new Error(res.error)); else console.error(res.error); }
            })
            .catch(function(err){ if (onErr) onErr(err); else console.error(err); });
        };
      }
    });
  }
  window.google.script.run = makeRunner(null, null);
})();
</script>

<script>
// NEW: persistent login - localStorage survives closing the browser / removing
// from Recent Apps / phone restart (sessionStorage did not). Falls back to
// sessionStorage if localStorage is blocked. Old sessionStorage logins migrate automatically.
const EMP_KEYS_ = ['employee_token', 'employee_name'];
function empStoreGet_(k){
  try { const v = localStorage.getItem(k); if(v !== null) return v; } catch(e){}
  try { return sessionStorage.getItem(k); } catch(e){ return null; }
}
function empStoreSet_(k, v){
  try { localStorage.setItem(k, v); } catch(e){}
  try { sessionStorage.setItem(k, v); } catch(e){}
}
function empStoreClear_(){
  EMP_KEYS_.forEach(function(k){
    try { localStorage.removeItem(k); } catch(e){}
    try { sessionStorage.removeItem(k); } catch(e){}
  });
}
let ETOKEN = empStoreGet_('employee_token') || null;
let EMP_NAME = empStoreGet_('employee_name') || '';
let MY_CUSTOMERS_CACHE = [];
let MC_LOADED_ = false; // NEW - true after the first successful My Customers fetch
let MC_ADV_ = { active:false, days:15, types:[], status:'has', statuses:[], tags:[] }; // NEW - applied Advanced Filter (statuses, tags: NEW)
const MC_ADV_TYPES_ = [['visit','Visit'],['sale','Sale'],['payment','Payment'],['order','Order']];
let MC_LAST_LIST_ = [];   // NEW - the customer list currently shown (used by Share)
let MC_SHARE_MSGS_ = [];  // NEW - prepared WhatsApp message parts
let ATTENDANCE_TIMER_ = null;

function q(sel){ return document.querySelector(sel); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(n){ n=Number(n)||0; return '₹'+n.toLocaleString('en-IN',{maximumFractionDigits:2}); }
function stat(label,value){ return '<div class="stat-card"><div class="label">'+esc(label)+'</div><div class="value">'+value+'</div></div>'; }
// NEW: same stat-card look, just clickable (used by "Today's Visits").
function clickableStat_(label,value,onclick){ return '<div class="stat-card" style="cursor:pointer" onclick="'+onclick+'"><div class="label">'+esc(label)+' \u203a</div><div class="value">'+value+'</div></div>'; }
function closeModal(){ q('#modalHost').innerHTML=''; }
function showToast(msg,type){
  const host=q('#toastHost'); const el=document.createElement('div');
  el.className='toast'+(type?' '+type:''); el.textContent=msg; host.appendChild(el);
  setTimeout(function(){el.remove();},3200);
}

// NEW: forces the mobile keyboard to open on the first tap for inputs
// inside the GAS sandboxed iframe (some Android WebViews/Chrome don't
// hand focus to the OS keyboard on a plain tap in that context).
function forceMobileFocus_(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('touchend', function(e){ e.preventDefault(); this.focus(); }, {passive:false});
}
forceMobileFocus_('empUser');
forceMobileFocus_('empPass');

/* ================= LOGIN / SESSION ================= */

function employeeLogin(){
  const user = q('#empUser').value.trim();
  const pass = q('#empPass').value;
  const errBox = q('#loginError'); errBox.classList.add('hidden');
  if(!user || !pass){ errBox.textContent='Enter your Employee ID and password.'; errBox.classList.remove('hidden'); return; }
  const btn = q('#empLoginBtn'); btn.disabled=true; btn.textContent='Signing in...';
  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled=false; btn.textContent='Sign In';
      if(res && res.success){
        ETOKEN = res.token; EMP_NAME = res.employeeName;
        empStoreSet_('employee_token', res.token);
        empStoreSet_('employee_name', res.employeeName);
        enterEmployee();
      } else { errBox.textContent = (res && res.message) || 'Login failed.'; errBox.classList.remove('hidden'); }
    })
    .withFailureHandler(function(){ btn.disabled=false; btn.textContent='Sign In'; errBox.textContent='Login failed.'; errBox.classList.remove('hidden'); })
    .apiEmployeeLogin(user, pass);
}

function employeeLogout(){
  google.script.run.apiEmployeeLogout(ETOKEN);
  empStoreClear_(); ETOKEN = null; EMP_NAME = '';
  MY_CUSTOMERS_CACHE = []; MC_LOADED_ = false; // NEW - next login fetches fresh once
  MC_LAST_LIST_ = []; MC_SHARE_MSGS_ = [];
  MY_TASKS_CACHE = []; MT_LOADED_ = false; // NEW
  EMP_DASH_LOADED_ = false; ORDERS_LOADED_ = false; ATT_STATUS_LOADED_ = false; ATT_HIST_LOADED_ = false; // NEW
  MC_ADV_ = { active:false, days:15, types:[], status:'has', statuses:[], tags:[] };
  if(ATTENDANCE_TIMER_){ clearInterval(ATTENDANCE_TIMER_); ATTENDANCE_TIMER_ = null; }
  // NEW - Shop View cleanup so a stale map never leaks into the next login
  SHOP_VIEW_CACHE = []; SHOP_VIEW_LOADED_ = false; SV_MODE_ = 'customers';
  if(SHOP_MAP_){ SHOP_MAP_.remove(); SHOP_MAP_ = null; }
  q('#appShell').style.display='none'; q('#loginScreen').style.display='flex';
}

function enterEmployee(){
  q('#loginScreen').style.display='none';
  q('#appShell').style.display='block';
  q('#topEmpName').textContent = EMP_NAME || 'EMPLOYEE';
  EMP_PHONE_ = '';          // NEW: never reuse a previous employee's number
  loadEmpProfile_();        // NEW: fetch logged-in employee's mobile for WhatsApp messages
  switchEmpTab('dashboard');
}

function onEmployeeSessionError(err){
  const msg = (err && err.message) ? err.message : String(err || 'Unknown error');
  console.error('Employee API error:', msg); // open DevTools (F12) Console to read this
  if (msg.indexOf('EMPLOYEE_SESSION_EXPIRED') !== -1) {
    showToast('Session expired. Please log in again.', 'err');
    employeeLogout();
  } else {
    showToast('Error: ' + msg, 'err'); // real reason, no forced logout
  }
}

window.addEventListener('load', function(){
  // NEW: ask the browser not to evict our saved login under storage pressure
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if(ETOKEN){
    google.script.run.withSuccessHandler(function(res){
      if(res && res.valid){ EMP_NAME = res.employeeName; empStoreSet_('employee_name', EMP_NAME); enterEmployee(); }
      else { empStoreClear_(); ETOKEN = null; }
    }).withFailureHandler(function(err){
      const msg = (err && err.message) ? err.message : String(err || '');
      if(msg.indexOf('EMPLOYEE_SESSION_EXPIRED') !== -1){ empStoreClear_(); ETOKEN = null; }
      else if(EMP_NAME){ enterEmployee(); } // NEW: slow net / cold start must NOT log the employee out
    }).apiEmployeeCheckSession(ETOKEN);
  }
  q('#empPass').addEventListener('keydown', function(e){ if(e.key==='Enter') employeeLogin(); });
});

function switchEmpTab(tab){
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab')===tab); });
  if(tab==='dashboard') renderEmpDashboard();
  else if(tab==='customers') renderMyCustomers();
  else if(tab==='tasks') renderMyTasks();
  else if(tab==='shopview') renderShopView();
  else if(tab==='orders') renderOrdersPage();
  else if(tab==='attendance') renderAttendancePage();
}

/* ================= MY TASKS ================= */
let MY_TASKS_CACHE = [], MT_LOADED_ = false, MT_TODAY_ = 0, MT_FILTER_ = 'due', MT_RULE_ = '';
function findTaskInCache_(id){ return MY_TASKS_CACHE.filter(function(x){ return x.taskId === id; })[0]; }
function mtIsDone_(t){ return t.status === 'Completed' || t.status === 'Resolved'; }

/* ================= NEW: MY TASKS - DATE FILTER + TASK REPORT ================= */
let MT_DATE_ = { preset:'', from:'', to:'', basis:'created' };
let MT_REPORT_ = { rows:[], status:'', limit:40, meta:null };

function mtDayMs_(s){ const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(Number(m[1]), Number(m[2])-1, Number(m[3])).getTime() : 0; }
function mtBaseToday_(){ const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function mtAddDays_(ms, n){ const d = new Date(ms); d.setDate(d.getDate()+n); return d.getTime(); }
function mtDateActive_(){ return !!(MT_DATE_.from || MT_DATE_.to); }

// Created date (default), Due date, or both must fall inside the range. Works together with Status / Type / Search.
function mtDateMatch_(t){
  if(!mtDateActive_()) return true;
  const from = MT_DATE_.from ? mtDayMs_(MT_DATE_.from) : 0;
  const to = MT_DATE_.to ? mtDayMs_(MT_DATE_.to) + 86399999 : 0;
  const inR = function(ms){ if(!ms) return false; if(from && ms < from) return false; if(to && ms > to) return false; return true; };
  if(MT_DATE_.basis === 'due') return inR(t.dueAt);
  if(MT_DATE_.basis === 'both') return inR(t.createdAt) && inR(t.dueAt);
  return inR(t.createdAt);
}
function mtDateBarInner_(){
  const bo = function(v, label){ return '<option value="'+v+'"'+(MT_DATE_.basis===v?' selected':'')+'>'+label+'</option>'; };
  return '<div class="mt-date-row">' +
      '<label>Start Date<input type="date" id="mtFrom" value="'+esc(MT_DATE_.from)+'" onchange="mtDateInput_()"></label>' +
      '<label>End Date<input type="date" id="mtTo" value="'+esc(MT_DATE_.to)+'" onchange="mtDateInput_()"></label>' +
      '<label>Filter by<select id="mtDateBasis" onchange="mtDateBasis_(this.value)">'+bo('created','Created date')+bo('due','Due date')+bo('both','Created &amp; due date')+'</select></label>' +
      '<button type="button" class="btn btn-ghost" style="width:100%;min-height:42px;" onclick="mtClearFilters_()">&#10006; Clear Filters</button>' +
    '</div>';
}
function mtDateBarHtml_(){ return '<div class="mt-datebar" id="mtDateBar">'+mtDateBarInner_()+'</div>'; }
function mtPaintDateBar_(){ const b = q('#mtDateBar'); if(b) b.innerHTML = mtDateBarInner_(); }
function mtSetPreset_(p){
  const T = mtBaseToday_();
  MT_DATE_.preset = p;
  if(p === 'today'){ MT_DATE_.from = MT_DATE_.to = mtDateStr_(T); }
  else if(p === 'yesterday'){ MT_DATE_.from = MT_DATE_.to = mtDateStr_(mtAddDays_(T,-1)); }
  else if(p === 'last7'){ MT_DATE_.from = mtDateStr_(mtAddDays_(T,-6)); MT_DATE_.to = mtDateStr_(T); }
  else if(p === 'last30'){ MT_DATE_.from = mtDateStr_(mtAddDays_(T,-29)); MT_DATE_.to = mtDateStr_(T); }
  mtPaintDateBar_(); paintMyTasks_();
}
function mtDateInput_(){
  const a = q('#mtFrom'), b = q('#mtTo'); if(!a || !b) return;
  let from = a.value, to = b.value;
  if(from && to && from > to){ const x = from; from = to; to = x; showToast('Start date was after end date - swapped.', 'ok'); }
  MT_DATE_.from = from; MT_DATE_.to = to; MT_DATE_.preset = 'custom';
  mtPaintDateBar_(); paintMyTasks_();
}
function mtDateBasis_(v){ MT_DATE_.basis = v; paintMyTasks_(); }
function mtClearFilters_(){
  MT_DATE_ = { preset:'', from:'', to:'', basis:'created' };
  MT_FILTER_ = 'due'; MT_RULE_ = '';
  const s = q('#mtSearch'); if(s) s.value = '';
  const f = q('#mtFilter'); if(f) f.value = 'due';
  const r = q('#mtRule'); if(r) r.value = '';
  mtPaintDateBar_(); paintMyTasks_();
}

/* ---- Task Report (uses the same Date / Type / Search filters; status filter is inside the report) ---- */
function mtReportFilters_(){
  return {
    from: MT_DATE_.from ? mtDayMs_(MT_DATE_.from) : 0,
    to: MT_DATE_.to ? mtDayMs_(MT_DATE_.to) + 86399999 : 0,
    basis: MT_DATE_.basis, rule: MT_RULE_,
    term: q('#mtSearch') ? q('#mtSearch').value : ''
  };
}
function openTaskReport_(){
  MT_REPORT_ = { rows:[], status:'', limit:40, meta:null };
  q('#modalHost').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal modal-wide" style="max-width:980px;">' +
      '<div class="modal-head"><h3>&#128202; Task Report</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body" id="trBody"><div class="skeleton" style="height:80px;"></div><div class="skeleton" style="height:160px;margin-top:10px;"></div></div>' +
      '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>' +
    '</div></div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(!q('#trBody')) return;
      if(!(res && res.success)){ q('#trBody').innerHTML = '<div class="empty-state">'+esc((res && res.message) || 'Could not load the report.')+'</div>'; return; }
      MT_REPORT_.rows = res.rows || []; MT_REPORT_.meta = res;
      paintTaskReport_();

function trCard_(r){
  const dash = function(v){ return (v===undefined||v===null||v==='') ? '—' : esc(v); };
  const kv = function(k, v){ return '<div class="tr-kv"><span>'+k+'</span><b>'+v+'</b></div>'; };
  const pill = function(s){ return '<span class="mt-pill '+(s==='Overdue'?'due':(s==='Pending'?'soon':'done'))+'">'+esc(s)+'</span>'; };
  const ev = function(e){ return '<div class="lt-item"><div class="lt-time">'+dash(e.dateTime)+'</div>'+(e.label?'<span class="lt-tag">'+esc(e.label)+'</span>':'')+(e.text?'<div class="lt-text">'+esc(e.text)+'</div>':'')+(e.by?'<div class="lt-by">by '+esc(e.by)+'</div>':'')+'</div>'; };
  const list = function(items, empty){ return (items && items.length) ? '<div class="lead-timeline">'+items.map(ev).join('')+'</div>' : '<div class="mt-sub">'+empty+'</div>'; };
  const f = r.finance;
  const fin = f
    ? kv('Last Sale', dash(f.lastSaleText)) + kv('Last Payment', dash(f.lastPaymentText)) + kv('Last Credit Note', dash(f.lastCreditNoteText)) +
      kv('Outstanding (current)', money(f.outstanding)) +
      kv('Overdue (current)', f.overdue>0 ? money(f.overdue)+(f.oldestOverdueText ? ' &middot; oldest due '+esc(f.oldestOverdueText)+' ('+esc(f.overdueDays)+'d)' : '') : '—')
    : kv('Last Sale / Payment / Credit Note', '—') + kv('Outstanding / Overdue', '—');
  const method = r.completionMethod
    ? kv('Completion method', esc(r.completionMethod)) +
      (r.completionReason ? kv('Completion reason', esc(r.completionReason)) : '') +
      (r.completionNote ? kv('Completion note', esc(r.completionNote)) : '')
    : kv('Completion method', '—');
  return '<div class="tr-card">' +
    '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;">' +
      '<div><div style="font-weight:700;font-size:14px;">'+dash(r.entityName)+(r.entityType==='Lead'?' <span class="mt-pill">Lead</span>':'')+'</div>' +
      '<div class="mt-sub">&#128222; '+dash(r.phone)+' &middot; '+esc(r.entityType)+' ID: '+dash(r.entityId)+'</div></div>' +
      pill(r.statusLabel) +
    '</div>' +
    '<div class="tr-grid">' +
      kv('Task ID', dash(r.taskId)) + kv('Task type', dash(r.ruleName)) + kv('Task title', dash(r.title)) + kv('Assigned to', dash(r.assignedName)) +
      kv('Created', dash(r.createdText)) + kv('Due date', dash(r.dueText)) + kv('Completed', dash(r.completedText)) + kv('Status', esc(r.statusLabel)) +
      fin + method +
    '</div>' +
    '<div class="tr-box"><b>Why this task was generated:</b> '+esc(r.reason)+'</div>' +
    '<div class="tr-box"><b>Latest note:</b> '+(r.latestNote ? esc(r.latestNote)+'<div class="mt-sub">'+(r.latestNoteBy?esc(r.latestNoteBy)+' &middot; ':'')+dash(r.latestNoteTime)+(r.latestNoteSource?' &middot; '+esc(r.latestNoteSource):'')+'</div>' : '—')+'</div>' +
    '<details class="tr-det"><summary>&#128172; WhatsApp messages ('+esc(r.waCount||0)+')</summary>'+list(r.wa, 'No WhatsApp message opened for this task.')+'</details>' +
    '<details class="tr-det"><summary>&#9200; Snooze / reschedule history ('+esc((r.reschedules||[]).length)+')</summary>'+list(r.reschedules, 'No reschedule recorded.')+'</details>' +
    '<details class="tr-det"><summary>&#128221; Task history ('+esc((r.timeline||[]).length)+')</summary>'+list(r.timeline, 'No history.')+'</details>' +
    '<details class="tr-det"><summary>&#128451; Customer / Lead notes &amp; activity ('+esc((r.activity||[]).length)+')</summary>'+list(r.activity, 'No notes or activity yet.')+'</details>' +
  '</div>';
}

function mtDueLabel_(t){
  const day = 86400000;
  if(t.dueAt <= MT_TODAY_){
    const d = Math.round((MT_TODAY_ - t.dueAt)/day);
    return { cls:'due', text: d <= 0 ? 'Due today' : (d+' day'+(d===1?'':'s')+' late') };
  }
  const d = Math.round((t.dueAt - MT_TODAY_)/day);
  return { cls:'soon', text: 'Due in '+d+' day'+(d===1?'':'s')+' ('+t.dueText+')' };
}
function mtAmountHtml_(t){
  const m = t.meta || {};
  if(t.rule === 'OUTSTANDING') return '<div style="font-weight:700;color:#c0392b;">'+money(m.outstanding)+'</div><div class="mt-sub">Outstanding</div>';
  if(t.rule === 'OVERDUE') return '<div style="font-weight:700;color:#c0392b;">'+money(m.overdue)+' overdue</div><div class="mt-sub">Total '+money(m.outstanding)+' &middot; oldest due '+esc(m.oldestDueText||'—')+' ('+(m.overdueDays||0)+'d)</div>';
  return '—';
}
function mtSentLabel_(t){ return t.rule === 'GREETING' ? 'Greeting sent' : (t.rule === 'COMMUNITY' ? 'Community invitation sent' : 'Reminder sent'); }
function mtActionsHtml_(t){
  const id = esc(t.taskId);

  return (done ? '' : '<button class="icon-btn" title="Complete Task" onclick="event.stopPropagation();openTaskCompleteModal_(\''+id+'\')">✅</button> ') +

}

function paintMyTasks_(){
  const host = q('#mtList'); if(!host) return;
  const term = (q('#mtSearch') ? q('#mtSearch').value : '').toLowerCase();
  const all = MY_TASKS_CACHE.filter(function(t){
    if(MT_RULE_ && t.rule !== MT_RULE_) return false;
    if(!mtDateMatch_(t)) return false;
    if(term && String(t.entityName||'').toLowerCase().indexOf(term)===-1 && String(t.phone||'').indexOf(term)===-1) return false;
    return true;
  });
  let rows = [];
  if(MT_FILTER_ === 'completed'){
    rows = all.filter(mtIsDone_).sort(function(a,b){ return b.completedAt - a.completedAt; }).map(function(t){ return { task:t, more:0 }; });
  } else {
    const pend = all.filter(function(t){
      if(t.status !== 'Pending') return false;
      if(MT_FILTER_ === 'all') return true;
      return MT_FILTER_ === 'upcoming' ? t.dueAt > MT_TODAY_ : t.dueAt <= MT_TODAY_;
    });
    const groups = {};
    pend.forEach(function(t){ const k = t.entityType+'|'+String(t.entityId).toUpperCase(); (groups[k] = groups[k] || []).push(t); });
    rows = Object.keys(groups).map(function(k){
      const g = groups[k].sort(function(a,b){ return a.dueAt - b.dueAt; });
      return { task:g[0], more:g.length - 1 };      // the NEXT pending task is shown; others are counted
    }).sort(function(a,b){ return a.task.dueAt - b.task.dueAt; });
  }
  if(!rows.length){
    host.innerHTML = '<div class="empty-state">'+(mtDateActive_() ? 'No tasks match the selected filters.' : (MT_FILTER_==='completed' ? 'No completed tasks yet.' : 'No tasks here. Nice work!'))+'</div>';
    return;
  }
  const cell = function(r){
    const t = r.task, done = mtIsDone_(t);
    const due = done ? { cls:'done', text:(t.status==='Resolved'?'Resolved ':'Completed ')+(t.completedText||'') } : mtDueLabel_(t);
    return { due: '<span class="mt-pill '+due.cls+'">'+esc(due.text)+'</span>',
             more: r.more > 0 ? ' <span class="mt-pill">+'+r.more+' more</span>' : '' };
  };
  const tableHtml = '<table><thead><tr><th>Customer / Lead</th><th style="width:190px">Action</th><th>Task</th><th>Due</th><th>Amount</th><th>Last Note</th></tr></thead><tbody>' +
    rows.map(function(r){
      const t = r.task, c = cell(r), id = esc(t.entityId);
      return '<tr class="clickable"><td onclick="openMtEntity_(\''+esc(t.entityType)+'\',\''+id+'\')"><strong>'+esc(t.entityName||'—')+'</strong>'+(t.entityType==='Lead'?' <span class="mt-pill">Lead</span>':'')+'<div class="mt-sub">'+esc(t.area||'')+'</div></td>' +
        '<td style="white-space:nowrap;">'+mtActionsHtml_(t)+'</td>' +
        '<td>'+esc(t.ruleName)+c.more+'</td>' +
        '<td>'+c.due+'</td>' +
        '<td>'+mtAmountHtml_(t)+'</td>' +
        '<td title="'+esc(t.lastNote||'')+'" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(t.lastNote ? (t.lastNote.length>40 ? t.lastNote.substring(0,40)+'...' : t.lastNote) : '—')+'</td></tr>';
    }).join('') + '</tbody></table>';
  const cardsHtml = '<div class="customers-mobile-cards">' +
    rows.map(function(r){
      const t = r.task, c = cell(r), id = esc(t.entityId);
      return '<div class="customer-card">' +
        '<div class="cc-top" onclick="openMtEntity_(\''+esc(t.entityType)+'\',\''+id+'\')"><span class="cc-title">'+esc(t.entityName||'—')+'</span>'+c.due+'</div>' +
        '<div class="cc-row"><span>Task</span><span style="text-align:right;">'+esc(t.ruleName)+c.more+'</span></div>' +
        (t.rule==='OUTSTANDING'||t.rule==='OVERDUE' ? '<div class="cc-row"><span>Amount</span><span style="text-align:right;">'+mtAmountHtml_(t)+'</span></div>' : '') +
        '<div class="cc-row"><span>Last Note</span><span style="max-width:60%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(t.lastNote ? (t.lastNote.length>40 ? t.lastNote.substring(0,40)+'...' : t.lastNote) : '—')+'</span></div>' +
        '<div class="cc-actions">'+mtActionsHtml_(t)+'</div>' +
      '</div>';
    }).join('') + '</div>';
  host.innerHTML = tableHtml + cardsHtml;
}

function openTaskWhatsApp_(taskId){
  const t = findTaskInCache_(taskId); if(!t) return;
  const digits = String(t.phone||'').replace(/\D/g,'');
  if(digits.length < 10){ showToast('Phone number not available.', 'err'); return; }
  const num = (digits.length >= 12 && digits.indexOf('91') === 0) ? digits : ('91' + digits.slice(-10));
  window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(t.message || ''), '_blank');
  if(t.needsSend && t.status === 'Pending' && !t.sentAt) setTimeout(function(){ openTaskSentConfirm_(taskId); }, 900);
}

function saveTaskComplete_(taskId){
  const note = q('#tcNote') ? q('#tcNote').value.trim() : '';
  const sent = q('#tcSent') ? q('#tcSent').checked : false;
  closeModal();
  doCompleteTask_(taskId, note, sent);
}
function doCompleteTask_(taskId, note, sent){
  const t = findTaskInCache_(taskId); if(!t || t.status !== 'Pending') return;
  const prev = { status:t.status, completedAt:t.completedAt, completedText:t.completedText, sentAt:t.sentAt, sentText:t.sentText, completionNote:t.completionNote };
  t.status = 'Completed'; t.completedAt = Date.now(); t.completedText = 'Just now'; t.completionNote = note;
  if(sent && !t.sentAt){ t.sentAt = Date.now(); t.sentText = 'Just now'; }
  paintMyTasks_();                                   // leaves the pending list immediately
  google.script.run
    .withSuccessHandler(function(res){
      const cur = findTaskInCache_(taskId);
      if(res && res.success){
        if(cur){ cur.completedText = res.completedText; if(res.sentText) cur.sentText = res.sentText; }
        showToast('Task completed.', 'ok');
        refreshMyTasksSilently_();                   // picks up the next scheduled task (e.g. community invitation)
      } else {
        if(cur) Object.assign(cur, prev);
        paintMyTasks_();
        showToast((res && res.message) || 'Could not complete task.', 'err');
      }
    })
    .withFailureHandler(function(err){ const cur = findTaskInCache_(taskId); if(cur) Object.assign(cur, prev); paintMyTasks_(); onEmployeeSessionError(err); })
    .apiEmployeeCompleteTask(ETOKEN, taskId, note, sent);
}

function mtDateStr_(ms){ const d = new Date(ms); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function tsQuick_(days){ if(q('#tsDate')) q('#tsDate').value = mtDateStr_(MT_TODAY_ + days*86400000); }
function openTaskSnoozeModal_(taskId){
  const t = findTaskInCache_(taskId); if(!t || t.status !== 'Pending') return;
  q('#modalHost').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal">' +
      '<div class="modal-head"><h3>Snooze / Reschedule</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +

        '<div class="field"><label>New follow-up date</label><input type="date" id="tsDate" min="'+mtDateStr_(MT_TODAY_)+'" value="'+mtDateStr_(MT_TODAY_ + 86400000)+'"></div>' +

        '</div>' +

      '</div>' +

function saveTaskSnooze_(taskId){
  const v = q('#tsDate').value, reason = q('#tsReason').value.trim();
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m){ showToast('Please pick a date.', 'err'); return; }
  const ms = new Date(Number(m[1]), Number(m[2])-1, Number(m[3])).getTime();
  if(ms < MT_TODAY_){ showToast('Pick today or a later date.', 'err'); return; }
  const t = findTaskInCache_(taskId); if(!t) return;
  const prev = { dueAt:t.dueAt, dueText:t.dueText };
  closeModal();
  t.dueAt = ms; t.dueText = mtDateStr_(ms); paintMyTasks_();     // optimistic
  google.script.run
    .withSuccessHandler(function(res){
      const cur = findTaskInCache_(taskId);
      if(res && res.success){ if(cur){ cur.dueAt = res.dueAt; cur.dueText = res.dueText; } showToast('Task rescheduled.', 'ok'); paintMyTasks_(); }
      else { if(cur) Object.assign(cur, prev); paintMyTasks_(); showToast((res && res.message) || 'Could not reschedule.', 'err'); }
    })
    .withFailureHandler(function(err){ const cur = findTaskInCache_(taskId); if(cur) Object.assign(cur, prev); paintMyTasks_(); onEmployeeSessionError(err); })
    .apiEmployeeSnoozeTask(ETOKEN, taskId, v, reason);
}

/* ---- WhatsApp: open chat immediately, log message + counter in background ---- */
function openTaskWhatsApp_(taskId){
  const t = findTaskInCache_(taskId); if(!t || t.status !== 'Pending') return;
  const digits = String(t.phone||'').replace(/\D/g,'');
  if(digits.length < 10){ showToast('Phone number not available.', 'err'); return; }
  const num = (digits.length >= 12 && digits.indexOf('91') === 0) ? digits : ('91' + digits.slice(-10));
  window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(t.message || ''), '_blank'); // must stay synchronous (popup blockers)
  const prev = Number(t.waCount)||0;
  t.waCount = prev + 1; paintMyTasks_();                                   // live counter
  google.script.run
    .withSuccessHandler(function(res){
      const cur = findTaskInCache_(taskId);
      if(res && res.success){
        if(cur) cur.waCount = res.count;
        paintMyTasks_();
        if(cur && !res.skipped && cur.needsSend && !cur.sentAt) setTimeout(function(){ openTaskSentConfirmV2_(taskId); }, 900);
      } else {
        if(cur) cur.waCount = prev; paintMyTasks_();
        showToast((res && res.message) || 'Could not record WhatsApp message.', 'err');
      }
    })
    .withFailureHandler(function(err){ const cur = findTaskInCache_(taskId); if(cur) cur.waCount = prev; paintMyTasks_(); onEmployeeSessionError(err); })
    .apiEmployeeLogTaskWhatsApp(ETOKEN, taskId);
}

function confirmTaskSent_(taskId){
  closeModal();

/* ================= GEOLOCATION HELPER ================= */

// Wraps navigator.geolocation in a promise; resolves to {lat:'',lng:''}
// (blank strings, not failure) if location is unavailable/denied, so a
// missing GPS fix never blocks Check In/Out or a Visit from being saved.
function captureLocation_(){
  return new Promise(function(resolve){
    if(!navigator.geolocation){ resolve({lat:'',lng:''}); return; }
    navigator.geolocation.getCurrentPosition(
      function(pos){ resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy }); },
      function(){ resolve({lat:'',lng:''}); },
      { enableHighAccuracy:true, timeout:8000, maximumAge:0 }
    );
  });
}

let ML_SHARE_MSGS_ = [];
function mlBuildSharePartsForWhatsApp_(){
  const list = ML_LAST_LIST_ || [];
  const DIV = '━━━━━━━━━━━━━━━━';
  const term = q('#mlSearch') ? q('#mlSearch').value.trim() : '';

  let headRest = DIV + '\n';
  headRest += '*Filter - Status:* ' + ML_ADV_.statuses.join(', ') + '\n';
  if(term) headRest += '*Search:* ' + term + '\n';
  headRest += '*Prepared By:* ' + EMP_NAME + '\n';
  headRest += '*Date:* ' + mcFmtDate_(Date.now()) + '\n';
  headRest += '*Total Leads:* ' + list.length + '\n' + DIV + '\n\n';
  const foot = '\nPlease follow up with the above leads accordingly.\nThank you.';

  const blocks = list.map(function(l, i){
    let b = '*' + (i+1) + '. ' + l.name + '*\n';
    b += '*Phone:* ' + (l.phoneNo || 'Not available') + '\n';
    b += '*Area:* ' + (l.area || 'Not available') + '\n';
    b += '*Status:* ' + (l.status || 'Not available') + '\n';
    return b;
  });

  const MAX = 5500;
  const reserve = encodeURIComponent(headRest + foot).length + 80;
  const groups = []; let cur = [], curLen = reserve;
  blocks.forEach(function(b, i){
    const l = encodeURIComponent(b + '\n').length;
    if(cur.length && curLen + l > MAX){ groups.push(cur); cur = []; curLen = reserve; }
    cur.push({ text: b, idx: i+1 }); curLen += l;
  });
  if(cur.length) groups.push(cur);

  return groups.map(function(g, gi){
    const title = '*LEAD LIST' + (groups.length>1 ? ' (Part ' + (gi+1) + ' of ' + groups.length + ')' : '') + '*\n';
    return {
      text: title + headRest + g.map(function(x){ return x.text; }).join('\n') + foot,
      from: g[0].idx, to: g[g.length-1].idx
    };
  });
}

function exportMlAdvFilterToCsv_(){
  if(!ML_ADV_.active){ showToast('Apply an Advanced Filter first.', 'err'); return; }
  const list = ML_LAST_LIST_ || [];
  if(!list.length){ showToast('No leads to export.', 'err'); return; }

  const term = q('#mlSearch') ? q('#mlSearch').value.trim() : '';
  const cols = ['#','Lead Name','Lead ID','Phone','Area','Address','Status','Last Activity Date','Last Note'];
  const rows = list.map(function(l, i){
    return [i+1, l.name||'', l.leadId||'', l.phoneNo||'', l.area||'', l.address||'', l.status||'', l.lastActivityDate||'', l.lastNote||''];
  });

  const csvCell = function(v){
    const s = String(v===undefined||v===null?'':v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const csvLine = function(arr){ return arr.map(csvCell).join(','); };
  const lines = [];
  lines.push(csvLine(['My Assigned Leads - Filtered List']));
  lines.push(csvLine(['Filter - Status: '+ML_ADV_.statuses.join(', ')]));
  if(term) lines.push(csvLine(['Search: '+term]));
  lines.push(csvLine(['Prepared By: '+EMP_NAME+'   Date: '+mcFmtDate_(Date.now())+'   Total: '+list.length]));
  lines.push('');
  lines.push(csvLine(cols));
  rows.forEach(function(r){ lines.push(csvLine(r)); });
  const csv = lines.join('\r\n');

  const blob = new Blob(['\ufeff'+csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'My_Leads_Filtered_' + mcFmtDate_(Date.now()).replace(/\s+/g,'_') + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---- NEW: Lead Status - 14 fixed values, click to change, saved silently ---- */
const LEAD_STATUSES_ = ['New Lead','Contacted','No Response','Follow-up','Interested','Quotation Sent','Negotiation','Order Pending','Converted','Customer','Not Interested','Wrong Number','Fake Lead','Duplicate','Unassign'];
function leadStatusLabel_(s){ const t = String(s||'').trim(); return LEAD_STATUSES_.indexOf(t) !== -1 ? t : 'Set status'; }
function findLeadInCache_(leadId){ return MY_LEADS_CACHE.filter(function(x){ return x.leadId === leadId; })[0]; }

let LS_MENU_LEAD_ = '';
function closeLeadStatusMenu_(){
  const m = q('#leadStatusMenu'); if(m) m.remove();
  LS_MENU_LEAD_ = '';
}
function openLeadStatusMenu_(el, leadId){
  const wasOpenFor = LS_MENU_LEAD_;
  closeLeadStatusMenu_();
  if(wasOpenFor === leadId) return; // tapping the same status again just closes the menu
  const l = findLeadInCache_(leadId); if(!l) return;
  LS_MENU_LEAD_ = leadId;
  const cur = String(l.status||'').trim();
  const m = document.createElement('div');
  m.id = 'leadStatusMenu'; m.className = 'lead-status-menu';
  m.innerHTML = LEAD_STATUSES_.map(function(s, i){
    return '<button type="button" class="'+(s===cur?'current':'')+'" onclick="pickLeadStatus_('+i+')">'+esc(s)+'</button>';
  }).join('') + '<button type="button" onclick="pickLeadReassign_()">Reassignment</button>';
  document.body.appendChild(m);
  const r = el.getBoundingClientRect();
  const mh = m.offsetHeight, mw = m.offsetWidth;
  let top = r.bottom + 4;
  if(top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
  const left = Math.max(8, Math.min(r.left, window.innerWidth - mw - 8));
  m.style.top = top + 'px'; m.style.left = left + 'px';
}
function pickLeadStatus_(i){
  const leadId = LS_MENU_LEAD_, status = LEAD_STATUSES_[i];
  closeLeadStatusMenu_();
  const l = findLeadInCache_(leadId);
  if(!l || !status) return;
  const prev = l.status;
  if(String(prev||'').trim() === status) return;
  if(status === 'Converted'){ openLeadConvertModal_(leadId, l.name); return; } // NEW - needs a linked customer first, never set directly
  if(status === 'Unassign'){ unassignLead_(leadId, l.name); return; } // NEW - removes the lead from you entirely, not a stored status
  // 1) update the screen instantly (optimistic) - no reload, no navigation
  l.status = status; l._stSaving = true;
  delete LEAD_DETAIL_CACHE_[leadId];   // NEW - cached Lead 360 for this lead is now out of date
  paintMyLeads_();
  // 2) save to the Lead sheet in the background
  google.script.run
    .withSuccessHandler(function(res){
      const cur = findLeadInCache_(leadId);
      if(cur) cur._stSaving = false;
      if(!(res && res.success)){
        if(cur && cur.status === status) cur.status = prev;   // roll back
        showToast((res && res.message) || 'Could not update status.', 'err');
      }
      paintMyLeads_();
    })
    .withFailureHandler(function(err){
      const cur = findLeadInCache_(leadId);
      if(cur){ cur._stSaving = false; if(cur.status === status) cur.status = prev; }
      paintMyLeads_();
      onEmployeeSessionError(err);
    })
    .apiEmployeeUpdateLeadStatus(ETOKEN, leadId, status);
}

// NEW: Unassign - removes the lead from "My Assigned Leads" entirely (does not touch Status/notes).
function unassignLead_(leadId, leadName){
  if(!confirm('Unassign "'+leadName+'" from yourself? It will disappear from your Assigned Leads list.')) return;
  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.success){
        MY_LEADS_CACHE = MY_LEADS_CACHE.filter(function(x){ return x.leadId !== leadId; });
        delete LEAD_DETAIL_CACHE_[leadId];
        showToast('Lead unassigned.', 'ok');
        paintMyLeads_();

        showToast((res && res.message) || 'Could not unassign lead.', 'err');
      }
    })
    .withFailureHandler(onEmployeeSessionError)
    .apiEmployeeUnassignLead(ETOKEN, leadId);
}

let AC_LOOKUP_SEQ_ = 0;
function checkAcDuplicate2_(){
  clearTimeout(AC_DUP_TIMER_);
  const box = q('#acDuplicate'); if(!box) return;
  const mobile = q('#acMobile').value.trim();
  const seq = ++AC_LOOKUP_SEQ_;
  if(mobile.replace(/\D/g,'').length < 10){ box.className='hidden'; box.innerHTML=''; return; }   // only a COMPLETE number is checked
  AC_DUP_TIMER_ = setTimeout(function(){
    google.script.run
      .withSuccessHandler(function(res){
        if(seq !== AC_LOOKUP_SEQ_ || !q('#acDuplicate')) return;   // ignore outdated replies
        paintAcLookup_(res);
      })
      .withFailureHandler(function(){})
      .apiEmployeeLookupLeadByPhone(ETOKEN, mobile);

function paintAcLookup_(res){
  const box = q('#acDuplicate'); if(!box) return;
  if(!res || !res.found){ box.className='hidden'; box.innerHTML=''; return; }
  box.className = 'duplicate-warning';
  if(res.type === 'customer'){
    box.innerHTML = 'Already in CRM as <strong>'+esc(res.customerName)+'</strong> ('+esc(res.customerId)+'), assigned to <strong>'+esc(res.assignedTo||'Unassigned')+'</strong>.';

      '<button type="button" class="btn btn-primary" id="acClaimBtn" style="margin-top:10px;width:100%;" onclick="claimAcLead_(\''+esc(res.leadId)+'\')">Claim This Lead</button>';

// Instant (same idea as Log Visit): modal closes, list / history update right now; the location
// capture and the sheet save continue in the background. If the save fails, the old state comes back + error toast.
function saveLeadNote_(leadId){
  const text = q('#lnText').value.trim();
  if(!text){ showToast('Please write a note.', 'err'); return; }
  const from = LEAD_NOTE_FROM_;
  const nowMs = Date.now();
  const nowTxt = new Date(nowMs).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:true });
  const l = findLeadInCache_(leadId);
  const prevLast = l ? { d:l.lastActivityDate, n:l.lastNote } : null;
  const cur = LEAD_DETAIL_CACHE_[leadId];
  const prevTl = cur ? cur.timeline : null, prevNotes = cur ? cur.notes : null;
  closeModal();

  const repaintDetail = function(c){
    if(LEAD_DETAIL_OPEN_ === leadId && q('#leadBackBtn')){ const y = window.pageYOffset || 0; renderLeadDetail_(c); window.scrollTo(0, y); }
  };
  if(l){ l.lastActivityDate = nowTxt; l.lastNote = text; if(from === 'list') paintMyLeads_(); }   // optimistic - list updates right now
  if(cur && cur.success){                                                                          // optimistic - history updates right now
    cur.timeline = [{ kind:'NOTE_ADDED', label:'Note Added', text:text, by:EMP_NAME, dateTime:nowTxt, t:nowMs }].concat(cur.timeline || []);
    cur.notes = [{ noteId:'', note:text, by:EMP_NAME, dateTime:nowTxt, t:nowMs }].concat(cur.notes || []);
    repaintDetail(cur);
  }
  showToast('Note added.', 'ok');
  EMP_DASH_LOADED_ = false;

  const revert = function(){
    if(l && prevLast){ l.lastActivityDate = prevLast.d; l.lastNote = prevLast.n; if(from === 'list') paintMyLeads_(); }
    const c2 = LEAD_DETAIL_CACHE_[leadId];
    if(c2 && prevTl !== null){ c2.timeline = prevTl; c2.notes = prevNotes; repaintDetail(c2); }
  };
  captureLocation_().then(function(loc){
    google.script.run
      .withSuccessHandler(function(res){
        if(res && res.success){
          refreshMyLeadsSilently_();
          if(LEAD_DETAIL_OPEN_ === leadId && q('#leadBackBtn')) refreshLeadDetailSilently_(leadId);
          else delete LEAD_DETAIL_CACHE_[leadId];
          if(res.verification === 'INSIDE') showToast('Verified: INSIDE lead location ('+res.distance+' m)', 'ok');
          else if(res.verification === 'OUTSIDE') showToast('Note saved from OUTSIDE the lead location ('+res.distance+' m away)', 'err');
          else if(res.verification) showToast('Location unavailable - note saved without verification.');
        } else { revert(); showToast((res && res.message) || 'Note could not be saved. Please try again.', 'err'); }
      })
      .withFailureHandler(function(err){ revert(); onEmployeeSessionError(err); })
      .apiEmployeeAddLeadNote(ETOKEN, leadId, text, loc.lat, loc.lng, loc.acc);
  });
}

function openLeadEditModal_(leadId, from){
  LEAD_EDIT_FROM_ = from || 'list';
  EL_PHOTO_ = { url:'', uploading:false };   // NEW - blank url = keep the current photo
  const cached = LEAD_DETAIL_CACHE_[leadId];
  if(cached && cached.success){
    renderLeadEditForm_(cached.lead, cached.options || {});   // already have the full record - zero network wait
    return;
  }
  // Open the modal INSTANTLY with whatever we already know from the list, then fill in the rest.
  const l = findLeadInCache_(leadId) || {};
  renderLeadEditForm_({
    leadId: leadId, name: l.name, phoneNo: l.phoneNo, area: l.area, status: l.status,
    shopOriginalName: '', address: '', lat: '', lng: '', priority: '', shopServices: '',
    shopSize: '', visitedDay: '', ownerName: '', ownership: '', remark: '', assignExecutive: EMP_NAME
  }, {}, true);
  google.script.run
    .withSuccessHandler(function(res){
      if(!res || !res.success){ showToast((res && res.message) || 'Could not load lead.', 'err'); return; }
      LEAD_DETAIL_CACHE_[leadId] = res;
      if(q('#elId') && q('#elId').value === leadId) renderLeadEditForm_(res.lead, res.options || {}); // same modal still open -> fill it in
    })

}
function saveLeadEdit_(leadId){
  const v = function(id){ return q('#'+id).value.trim(); };
  if(!v('elName')){ showToast('Lead name is required.', 'err'); return; }
  if(EL_PHOTO_.uploading){ showToast('Photo is still uploading - please wait a moment.', 'err'); return; }
  const btn = q('#elSaveBtn'); btn.disabled=true; btn.textContent='Saving...';
  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled=false; btn.textContent='Update Lead';
      if(res && res.success){
        showToast('Lead updated.', 'ok'); closeModal();
        delete LEAD_DETAIL_CACHE_[leadId]; if(LEAD_EDIT_FROM_ === 'detail') openLeadDetail_(leadId, true); else refreshMyLeadsSilently_();
      } else { showToast((res && res.message) || 'Failed to update lead.', 'err'); }
    })
    .withFailureHandler(function(){ btn.disabled=false; btn.textContent='Update Lead'; showToast('Failed to update lead.', 'err'); })
    .apiEmployeeUpdateLead(ETOKEN, leadId, {
      name: v('elName'), shopOriginalName: v('elShop'), phoneNo: v('elPhone'), area: v('elArea'),
      address: v('elAddress'), lat: v('elLat'), lng: v('elLng'), priority: v('elPriority'), status: v('elStatus'),
      shopServices: v('elServices'), shopSize: v('elSize'), visitedDay: v('elVisited'),
      ownerName: v('elOwner'), ownership: v('elOwnership'), remark: v('elRemark'), photoUrl: EL_PHOTO_.url
    });
}

/* ---- Lead 360 details page: in-page (SPA) navigation + full activity timeline ---- */
let LEAD_DETAIL_CACHE_ = {};   // leadId -> last server response (re-opening a lead is instant)
let LEAD_DETAIL_OPEN_ = '';    // leadId currently on screen
let LEADS_VIEW_STASH_ = null;  // Assigned Leads screen, parked (NOT destroyed) while a Lead is open

// Parks the current Assigned Leads DOM (search text, scroll position, everything) in memory.
function stashLeadsView_(){
  const main = q('#mainContent');
  if(!main || !q('#mlList')) return;              // only when the leads list is what's on screen
  const frag = document.createDocumentFragment();
  while(main.firstChild) frag.appendChild(main.firstChild);
  LEADS_VIEW_STASH_ = { frag: frag, scroll: window.pageYOffset || 0 };
}

// Back button: put the parked list straight back - no rebuild, no skeleton, no waiting.
function backToMyLeads_(){
  LEAD_DETAIL_OPEN_ = '';
  const main = q('#mainContent');
  MC_MODE_ = 'leads';
  if(LEADS_VIEW_STASH_ && main){
    const s = LEADS_VIEW_STASH_; LEADS_VIEW_STASH_ = null;
    main.innerHTML = '';
    main.appendChild(s.frag);
    paintMyLeads_();                 // instant repaint from the in-memory cache
    window.scrollTo(0, s.scroll);
    refreshMyLeadsSilently_();       // quiet background sync (no skeleton)
    return;
  }
  renderMyCustomers();               // fallback = the old behaviour
}

function leadTlClass_(kind){
  switch(kind){
    case 'CALL_CLICKED': case 'WHATSAPP': return 't-call';
    case 'STATUS_CHANGED': return 't-status';
    case 'LEAD_CONVERTED': case 'CUSTOMER_CONVERTED': return 't-convert';
    case 'TAG_REMOVED': return 't-remove';
    case 'LEAD_CREATED': case 'LEAD_ASSIGNED': case 'LEAD_REASSIGNED': case 'TAG_ADDED': case 'ORDER_CREATED': return 't-create';
    case 'LEAD_UPDATED': case 'ACTIVITY_CHANGED': case 'VISIT_ACTION': return 't-edit';
    default: return '';
  }
}
function leadBackBtn_(){ return '<button class="back-link" id="leadBackBtn" onclick="backToMyLeads_()">&larr; Back to My Assigned Leads</button>'; }

// Re-fetches the open lead and repaints in place (keeps scroll position, no skeleton).
function refreshLeadDetailSilently_(leadId){
  google.script.run
    .withSuccessHandler(function(res){
      if(!res || !res.success) return;
      LEAD_DETAIL_CACHE_[leadId] = res;
      if(LEAD_DETAIL_OPEN_ !== leadId || !q('#leadBackBtn')) return;   // user already moved on
      const y = window.pageYOffset || 0;
      renderLeadDetail_(res);
      window.scrollTo(0, y);
    })
    .withFailureHandler(function(){})
    .apiEmployeeGetLeadDetail(ETOKEN, leadId);
}

// 📞 click -> quietly record "Call Clicked" in the lead's timeline.
function logLeadCall_(leadId){
  google.script.run
    .withSuccessHandler(function(){
      delete LEAD_DETAIL_CACHE_[leadId];
      if(LEAD_DETAIL_OPEN_ === leadId && q('#leadBackBtn')) refreshLeadDetailSilently_(leadId);
    })
    .withFailureHandler(function(){})
    .apiEmployeeLogLeadActivity(ETOKEN, leadId, 'CALL_CLICKED', '');
}

function openLeadDetail_(leadId, fresh){
  // "fresh" = data just changed (note saved / lead edited) while this page is already open -> refresh in place.
  if(fresh && LEAD_DETAIL_OPEN_ === leadId && q('#leadBackBtn')){ refreshLeadDetailSilently_(leadId); return; }
  const main = q('#mainContent');
  stashLeadsView_();                 // park the list instead of destroying it
  LEAD_DETAIL_OPEN_ = leadId;
  const cached = fresh ? null : LEAD_DETAIL_CACHE_[leadId];
  if(cached){
    renderLeadDetail_(cached);       // instant - then refreshed quietly below
  } else {
    const pre = findLeadInCache_(leadId);
    main.innerHTML = leadBackBtn_() +
      (pre ? '<div class="page-header"><div><h2>'+esc(pre.name||'')+'</h2><p>'+esc(pre.leadId||'')+'</p></div></div>' : '') +
      '<div class="skeleton" style="height:200px"></div>';
  }
  window.scrollTo(0, 0);
  google.script.run
    .withSuccessHandler(function(res){
      if(LEAD_DETAIL_OPEN_ !== leadId || !q('#leadBackBtn')) return;   // user already moved on
      if(!res || !res.success){
        delete LEAD_DETAIL_CACHE_[leadId];
        q('#mainContent').innerHTML = leadBackBtn_() + '<div class="empty-state">'+esc((res && res.message) || 'Lead not found.')+'</div>';
        return;
      }
      LEAD_DETAIL_CACHE_[leadId] = res;
      const y = cached ? (window.pageYOffset || 0) : 0;
      renderLeadDetail_(res);
      window.scrollTo(0, y);
    })
    .withFailureHandler(onEmployeeSessionError)
    .apiEmployeeGetLeadDetail(ETOKEN, leadId);
}

// HAS = any selected activity within N days; NONE = no selected activity within N days.
function mcAdvMatch_(c){
  const d = new Date(); d.setHours(0,0,0,0);
  const cutoff = d.getTime() - MC_ADV_.days * 86400000;
  const rawKey = { visit:'lastLogVisitRaw', sale:'lastSaleDateRaw', payment:'lastPaymentDateRaw', order:'lastOrderDateRaw' };
  const hasAny = MC_ADV_.types.some(function(t){ return (Number(c[rawKey[t]])||0) >= cutoff; });
  const activityOk = MC_ADV_.status==='has' ? hasAny : !hasAny;
  // NEW: optional Customer Status narrowing (OR among selected statuses)
  if(MC_ADV_.statuses && MC_ADV_.statuses.length && MC_ADV_.statuses.indexOf(String(c.pipelineStatus||'').trim())===-1) return false;
  // NEW: optional Tags narrowing (OR among selected tags - customer needs at least one of them)
  if(MC_ADV_.tags && MC_ADV_.tags.length){
    const ct = c.tags || [];
    if(!MC_ADV_.tags.some(function(t){ return ct.indexOf(t) > -1; })) return false;
  }
  return activityOk;
}

/* ================= SHARE FILTERED CUSTOMER LIST (WhatsApp) ================= */

const MC_MON_ = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MC_ADV_LABELS_ = { visit:'Last Visit Logged', sale:'Last Sale', payment:'Last Payment', order:'Last Order' };
const MC_ADV_RAWKEY_ = { visit:'lastLogVisitRaw', sale:'lastSaleDateRaw', payment:'lastPaymentDateRaw', order:'lastOrderDateRaw' };

function mcFmtDate_(ms){
  const d = new Date(ms);
  return ('0'+d.getDate()).slice(-2) + ' ' + MC_MON_[d.getMonth()] + ' ' + d.getFullYear();
}
function mcDaysSince_(ms){
  const t = new Date(); t.setHours(0,0,0,0);
  const d = new Date(ms); d.setHours(0,0,0,0);
  return Math.max(0, Math.round((t.getTime() - d.getTime()) / 86400000));
}
function mcAgo_(n){ return n===0 ? 'Today' : n + (n===1 ? ' day ago' : ' days ago'); }
function mcDaysText_(n){ return n===0 ? 'Today' : n + (n===1 ? ' day' : ' days'); }

// Lat,Long link when valid; otherwise an address-search link; otherwise ''.
function mcMapLink_(c){
  if(isValidLatLong_(c.latLong)) return 'https://maps.google.com/?q=' + String(c.latLong).trim().replace(/\s+/g,'');
  const a = String(c.address||'').trim();
  if(a) return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a);
  return '';
}

// Builds one or more WhatsApp messages (split only if the list is too long for one link).
function mcBuildSharePartsForWhatsApp_(){
  const list = MC_LAST_LIST_ || [];
  const DIV = '━━━━━━━━━━━━━━━━';
  const typeNames = MC_ADV_TYPES_.filter(function(t){ return MC_ADV_.types.indexOf(t[0])>-1; }).map(function(t){ return t[1]; }).join(', ');
  const term = q('#mcSearch') ? q('#mcSearch').value.trim() : '';

  let headRest = DIV + '\n';
  headRest += '*Filter:* ' + (MC_ADV_.status==='has' ? 'Has Activity' : 'No Activity') + ' in ' + typeNames + '\n';
  headRest += '*Period:* Last ' + MC_ADV_.days + ' day' + (MC_ADV_.days===1 ? '' : 's') + '\n';
  if(term) headRest += '*Search:* ' + term + '\n';
  if(MC_DAY_FILTER) headRest += '*Visited Day:* ' + MC_DAY_FILTER + '\n';
  headRest += '*Prepared By:* ' + EMP_NAME + '\n';
  headRest += '*Date:* ' + mcFmtDate_(Date.now()) + '\n';
  headRest += '*Total Customers:* ' + list.length + '\n' + DIV + '\n\n';
  const foot = '\nPlease follow up with the above customers accordingly.\nThank you.';

  const blocks = list.map(function(c, i){
    let b = '*' + (i+1) + '. ' + c.customerName + '*\n';
    b += '*Address:* ' + (String(c.address||'').trim() || 'Not available') + '\n';
    b += '*Location:* ' + (mcMapLink_(c) || 'Not available') + '\n';
    let latest = 0;
    MC_ADV_.types.forEach(function(t){
      const ms = Number(c[MC_ADV_RAWKEY_[t]]) || 0;
      if(ms > latest) latest = ms;
      b += '*' + MC_ADV_LABELS_[t] + ':* ' + (ms ? mcFmtDate_(ms) + ' (' + mcAgo_(mcDaysSince_(ms)) + ')' : 'No record') + '\n';
    });
    b += '*Days Since Last Activity:* ' + (latest ? mcDaysText_(mcDaysSince_(latest)) : 'No activity recorded') + '\n';
    return b;
  });

  // Group customers so each message stays inside a safe WhatsApp link size.
  const MAX = 5500;
  const reserve = encodeURIComponent(headRest + foot).length + 80;
  const groups = []; let cur = [], curLen = reserve;
  blocks.forEach(function(b, i){
    const l = encodeURIComponent(b + '\n').length;
    if(cur.length && curLen + l > MAX){ groups.push(cur); cur = []; curLen = reserve; }
    cur.push({ text: b, idx: i+1 }); curLen += l;
  });
  if(cur.length) groups.push(cur);

  return groups.map(function(g, gi){
    const title = '*CUSTOMER LEAD LIST' + (groups.length>1 ? ' (Part ' + (gi+1) + ' of ' + groups.length + ')' : '') + '*\n';
    return {
      text: title + headRest + g.map(function(x){ return x.text; }).join('\n') + foot,
      from: g[0].idx, to: g[g.length-1].idx
    };
  });
}

/* ---- NEW: Advanced Filter -> download the SAME filtered list as Excel (.xls) ---- */
function mcXlEsc_(v){ return String(v===undefined||v===null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function exportMcAdvFilterToExcel_(){
  if(!MC_ADV_.active){ showToast('Apply an Advanced Filter first.', 'err'); return; }
  const list = MC_LAST_LIST_ || [];
  if(!list.length){ showToast('No customers to export.', 'err'); return; }

  const typeNames = MC_ADV_TYPES_.filter(function(t){ return MC_ADV_.types.indexOf(t[0])>-1; }).map(function(t){ return t[1]; }).join(', ');
  const term = q('#mcSearch') ? q('#mcSearch').value.trim() : '';

  const cols = ['#','Customer Name','Customer ID','Mobile','Area','Address','Visited Day','Status','Outstanding',
    'Last Sale Date','Last Visit Logged','Last Payment Date','Last Order Date','Days Since Last Activity'];

  const rows = list.map(function(c, i){
    let latest = 0;
    MC_ADV_.types.forEach(function(t){ const ms = Number(c[MC_ADV_RAWKEY_[t]])||0; if(ms>latest) latest = ms; });
    return [
      i+1, c.customerName||'', c.customerId||'', c.mobile||'', c.area||'', c.address||'', c.visitedDay||'', c.status||'',
      Number(c.outstanding)||0,
      c.lastSaleDate||'', (c.lastLogVisitRaw?mcFmtDate_(c.lastLogVisitRaw):''),
      (c.lastPaymentDateRaw?mcFmtDate_(c.lastPaymentDateRaw):''), (c.lastOrderDateRaw?mcFmtDate_(c.lastOrderDateRaw):''),
      latest ? mcDaysText_(mcDaysSince_(latest)) : ''
    ];
  });

  // FIX: Excel's newer "format doesn't match extension" warning (and
  // sometimes an outright failure to open) happens because the file was
  // HTML content saved with a ".xls" name. A genuine CSV has no such
  // mismatch - every spreadsheet program (Excel, Google Sheets, WPS,
  // LibreOffice) opens it directly with zero warnings.
  const csvCell = function(v){
    const s = String(v===undefined||v===null?'':v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const csvLine = function(arr){ return arr.map(csvCell).join(','); };
  const lines = [];
  lines.push(csvLine(['My Customers - Filtered List']));
  lines.push(csvLine(['Filter: '+(MC_ADV_.status==='has'?'Has Activity':'No Activity')+' - '+typeNames+' - last '+MC_ADV_.days+' day'+(MC_ADV_.days===1?'':'s')]));
  if(term) lines.push(csvLine(['Search: '+term]));
  if(MC_DAY_FILTER) lines.push(csvLine(['Visited Day: '+MC_DAY_FILTER]));
  lines.push(csvLine(['Prepared By: '+EMP_NAME+'   Date: '+mcFmtDate_(Date.now())+'   Total: '+list.length]));
  lines.push('');
  lines.push(csvLine(cols));
  rows.forEach(function(r){ lines.push(csvLine(r)); });
  const csv = lines.join('\r\n');

  const blob = new Blob(['\ufeff'+csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'My_Customers_Filtered_' + mcFmtDate_(Date.now()).replace(/\s+/g,'_') + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    .withSuccessHandler(function(res){

    })
    .withFailureHandler(function(err){
      const cur = findCustomerInCache_(cid);
      if(cur){ cur._stSaving = false; if(cur.pipelineStatus === status) cur.pipelineStatus = prev; }
      paintMyCustomers_();

      // every line, starting from Opening Balance. Same signed rule used
      // everywhere else in this project (Sale: +balanceAmount, Credit
      // Note: -amount, Payment-in: -(receivedAmount+paidAmount)).
      // FIX: a blind .reverse() only flips the WHOLE array - for
      // transactions on the SAME date it also swaps their relative
      // order, which then attaches the running Balance to the wrong

      // tie (same date) keep sheet entry order via rowNumber - the
      // SAME tie-break rule runFifoEngine_ already uses - so this
      // ledger and the FIFO bill status always agree.
           // NEW: build a classic ledger - oldest first, running balance after
      // every line, starting from Opening Balance. Same signed rule used
      // everywhere else in this project (Sale: +balanceAmount, Credit
      // Note: -amount, Payment-in: -(receivedAmount+paidAmount)), now
      // extended with:
      //   Payment-out -> +(receivedAmount+paidAmount) - money PAID OUT
      //                  to the customer, mirror of Payment-in. Was
      //                  previously unhandled and silently dropped.
      //   Estimate/Quotation -> explicit no-op, ₹0 (only a quote).
      // FIX: a blind .reverse() only flips the WHOLE array - for
      // transactions on the SAME date it also swaps their relative
      // order, attaching the running Balance to the wrong row. Sort

      // date) keep sheet entry order via rowNumber - the SAME tie-break

      // bill status always agree.
      const chrono = txns.slice().sort(function(a, b){
        const d = (a.dateRaw||0) - (b.dateRaw||0);
        if (d !== 0) return d;
        return (a.rowNumber||0) - (b.rowNumber||0);
      });

      function ledgerDesc_(t){
